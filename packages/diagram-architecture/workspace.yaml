# How this package plugs into the shared workspace tools (tools/workspace/diagrams.ts). Not published.
# A pre-manifest package until T5 (#618) adds the `mermaid` manifest: `configDefaults`, `release`
# and `languageBundle` wait for it (v13/docs/agents/port-diagram/shared-files.md).

# grammars: tools/gen-grammar's targets, one per grammar file (`grammar/<grammar>.ebnf`): the
# type names the generated tables, `title` the syntax page, `kinds` the token kinds (D94).
grammars:
  - type: architecture
    title: Architecture diagram syntax
    kinds:
      module: parser/tokens.ts
      object: T

# theme: the theme specs' exemptions. Reads no theme variable until its renderer (#614).
theme:
  notDrawnYet: true
