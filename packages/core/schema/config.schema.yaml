          replacement: '`theme`, or the geometry and `dropShadow` theme variables'
      layout:
        $ref: '#/$defs/BaseDiagramConfig/properties/layout'
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            No ER default, as in v12: the top-level `layout` applies, `layered` (D127,
