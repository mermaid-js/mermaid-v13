  ClassDiagramConfig:
    title: Class Diagram Config
    allOf: [{ $ref: '#/$defs/BaseDiagramConfig' }]
    type: object
    unevaluatedProperties: false
    required:
      - titleTopMargin
      - useMaxWidth
    properties:
      theme:
        $ref: '#/$defs/BaseDiagramConfig/properties/theme'
        default: 'redux-color'
        x-mermaid: { status: honoured, since: 13.0.0 }
      look:
        $ref: '#/$defs/BaseDiagramConfig/properties/look'
        x-mermaid:
          status: ignored
          since: 13.0.0
          reason: >-
            `look` is removed (D153): ignored, with one `LOOK_REMOVED` warning per render,
            whatever the diagram section.
          replacement: '`theme`, or the geometry and `dropShadow` theme variables'
      layout:
        $ref: '#/$defs/BaseDiagramConfig/properties/layout'
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            No class default, as in v12: the top-level `layout` applies, `layered` (D127,
            R-LAYOUT-7: ELK is never the default). `elk` and `elk.<algorithm>` apply only when an
            author sets them, and are drawn by `@mermaid-js/layout-elk` once it is registered;
            without it they draw with `layered` and add one `ELK_NOT_INSTALLED` warning (D106,
            D173).
      useWidth:
        $ref: '#/$defs/BaseDiagramConfig/properties/useWidth'
        x-mermaid:
          status: ignored
          since: 13.0.0
          reason: Only v12's gantt renderer read `useWidth`; the class renderers never did.
      useMaxWidth:
        $ref: '#/$defs/BaseDiagramConfig/properties/useMaxWidth'
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            v12's class renderer read `state.useMaxWidth` instead (a v12 bug); v13 reads
            `class.useMaxWidth`.
      titleTopMargin:
        $ref: '#/$defs/GitGraphDiagramConfig/properties/titleTopMargin'
        default: 25
        x-mermaid:
          status: ignored
          since: 13.0.0
          reason: The class SVG draws no front-matter `title`, as flowchart's.
      # YAML anchor reference, don't use $ref since ajv doesn't load defaults
      arrowMarkerAbsolute: *arrowMarkerAbsolute
      dividerMargin:
        type: number
        default: 10
        x-mermaid:
          status: ignored
          since: 13.0.0
          reason: >-
            Read only by v12's old class renderer (`svgDraw.js`), which 12.2.0 no longer reached:
            both keywords used the unified renderer, which did not read it.
      padding:
        description: |
          Padding inside class boxes, namespaces and notes, in pixels. Unset, class boxes are
          padded 12, namespaces 16 and notes 6, as v12 drew them.
        type: number
        default: 12
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            The documented default changes from 5 to 12, the padding v12 drew class boxes with
            (D125): its schema said 5 but its renderer never got it. Unset, namespaces keep v12's
            16 and notes its 6; set, the value pads all three.
      textHeight:
        type: number
        default: 10
        x-mermaid:
          status: ignored
          since: 13.0.0
          reason: >-
            Read only by v12's old class renderer (`svgDraw.js`), which 12.2.0 no longer reached:
            both keywords used the unified renderer, which did not read it.
      nodeSpacing:
        type: integer
        minimum: 0
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            v12's class renderer read `state.nodeSpacing` instead (a v12 bug), else 50; v13
            reads `class.nodeSpacing`, else 50.
      rankSpacing:
        type: integer
        minimum: 0
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            v12's class renderer read `state.rankSpacing` instead (a v12 bug), else 50; v13
            reads `class.rankSpacing`, else 50.
      diagramPadding:
        $ref: '#/$defs/ErDiagramConfig/properties/diagramPadding'
        default: 8
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            The documented default changes from 20 to 8, the padding v12 drew class diagrams
            with (D125): its renderer ignored the key and used 8.
      htmlLabels:
        type: boolean
        default: false
        x-mermaid:
          status: removed
          since: 13.0.0
          reason: Labels are SVG text only; there is no HTML label mode (D5).
          replacement: none; labels support a markdown subset rendered as SVG text
      hideEmptyMembersBox:
        type: boolean
        default: false
        x-mermaid: { status: honoured, since: 13.0.0 }
      hierarchicalNamespaces:
        type: boolean
        default: true
        description: |
          When true (default), nested namespaces render as hierarchical clusters,
          with each segment of a dotted name (e.g. `A.B.C`) becoming its own nested
          box. When false, namespaces render in compact mode: only explicitly
          declared namespaces are emitted and their full qualified name is used as
          a single flat label.
        x-mermaid: { status: honoured, since: 13.0.0 }

  JourneyDiagramConfig:
    title: Journey Diagram Config
    allOf: [{ $ref: '#/$defs/BaseDiagramConfig' }]
    description: |
      The object containing configurations specific for journey diagrams
    type: object
    unevaluatedProperties: false
    required:
      - diagramMarginX
      - diagramMarginY
      - leftMargin
      - width
      - height
      - boxMargin
      - boxTextMargin
      - noteMargin
      - messageMargin
      - messageAlign
      - bottomMarginAdj
      - useMaxWidth
      - rightAngles
      - titleColor
      - titleFontSize
    properties:
      useWidth:
        $ref: '#/$defs/BaseDiagramConfig/properties/useWidth'
        x-mermaid:
          status: ignored
          since: 13.0.0
          reason: Only v12's gantt renderer read `useWidth`; the journey renderer never did.
      useMaxWidth:
        $ref: '#/$defs/BaseDiagramConfig/properties/useMaxWidth'
        x-mermaid: { status: honoured, since: 13.0.0 }
      diagramMarginX:
        $ref: '#/$defs/C4DiagramConfig/properties/diagramMarginX'
        default: 50
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            The margin left and right of what is drawn (D224, D242). v12 had no left margin and
            also used it as the gap between section bands and as a task's width in its bounds; bands
            are now `taskMargin` apart.
      diagramMarginY:
        $ref: '#/$defs/C4DiagramConfig/properties/diagramMarginY'
        default: 10
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            The margin above and below what is drawn (D224). v12 fixed the top at -25 and added 70
            for a title.
      leftMargin:
        description: Margin between actors
        type: integer
        default: 150
        minimum: 0
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            Where the first task starts, as in v12. It widens by the widest legend line past it,
            with no threshold, and is counted once in the width (D242); v12 jumped from 150 to about
            230 px once a legend line passed `leftMargin / 2`, and counted it twice.
      maxLabelWidth:
        description: Maximum width of actor labels
        type: integer
        default: 360
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            The width legend names wrap to (core label layout, D225). Words longer than it split
            without v12's hyphen.
      width:
        description: Width of actor boxes
        type: integer
        default: 150
        minimum: 0
        x-mermaid: { status: honoured, since: 13.0.0 }
      height:
        description: Height of actor boxes
        type: integer
        default: 50
        minimum: 0
        x-mermaid: { status: honoured, since: 13.0.0 }
      boxMargin:
        description: Margin around loop boxes
        type: integer
        default: 10
        minimum: 0
        x-mermaid:
          status: ignored
          since: 13.0.0
          reason: >-
            v12's journey renderer read it only in a loop over an empty list, so it had no effect.
      boxTextMargin:
        description: Margin around the text in loop/alt/opt boxes
        type: integer
        default: 5
        minimum: 0
        x-mermaid: { status: honoured, since: 13.0.0 }
      noteMargin:
        description: Margin around notes
        type: integer
        default: 10
        minimum: 0
        x-mermaid:
          status: ignored
          since: 13.0.0
          reason: >-
            v12's journey renderer never read it.
      messageMargin:
        description: Space between messages.
        type: integer
        default: 35
        minimum: 0
        x-mermaid:
          status: ignored
          since: 13.0.0
          reason: >-
            v12's journey renderer never read it.
      messageAlign:
        description: Multiline message alignment
        type: string
        enum:
          - left
          - center
          - right
        default: center
        x-mermaid:
          status: ignored
          since: 13.0.0
          reason: >-
            v12's journey renderer never read it.
      bottomMarginAdj:
        description: |
          Prolongs the edge of the diagram downwards.

          Depending on css styling this might need adjustment.
        type: integer
        default: 1
        minimum: 0
        x-mermaid:
          status: ignored
          since: 13.0.0
          reason: >-
            v12's journey renderer never read it.
      rightAngles:
        description: |
          Curved Arrows become Right Angles

          This will display arrows that start and begin at the same node as
          right angles, rather than as curves.
        type: boolean
        default: false
        x-mermaid:
          status: ignored
          since: 13.0.0
          reason: >-
            v12's journey renderer never read it.
      taskFontSize:
        type: *fontSizeType
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            The default changes: unset, task and section names are drawn in the theme's
            `fontSize` (16 by default), as for every diagram type, not v12's 14. A set value
            takes effect.
      taskFontFamily:
        type: string
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            The default changes: unset, it is the theme's `fontFamily`, as for every diagram
            type, not v12's Open Sans. A set value takes effect.
      taskMargin:
        type: number
        default: 50
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            The gap between tasks and, now, between section bands (D242).
      activationWidth:
        description: Width of activation box
        type: number
        default: 10
        x-mermaid:
          status: ignored
          since: 13.0.0
          reason: >-
            v12's journey renderer never read it.
      textPlacement:
        description: |
          text placement as: tspan | fo | old only text as before
        type: string
        # TODO, should this be an enum?
        default: fo
        x-mermaid:
          status: ignored
          since: 13.0.0
          reason: >-
            Every label is SVG text from core label layout, wrapped to its box, in `textColor`,
            with `<br>` breaking lines (D225); there is no `foreignObject` or `tspan`-only mode.
      actorColours:
        type: array
        items:
          type: string
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            The actor dot colours in every theme (D249); an author's `actor0`–`actor5` theme
            variable wins. Unset, dots take v12's six colours (`#8FBC8F`, `#7CFC00`, `#00FFFF`,
            `#20B2AA`, `#B0E0E6`, `#FFFFE0`); a list set by the author replaces them (v12 appended
            it after them). The empty actor `''` takes no colour (D244). A value that is not a
            colour is dropped with `STYLE_VALUE_DROPPED`.
      sectionFills:
        type: array
        items:
          type: string
        default: ['#191970', '#8B008B', '#4B0082', '#2F4F4F', '#800000', '#8B4513', '#00008B']
        x-mermaid:
          status: ignored
          since: 13.0.0
          reason: >-
            Sections are filled from the theme's `fillType0`–`fillType7`, cycling over all eight
            (D241). In v12 the theme's `fillType<n>` style rules hid these colours in every theme.
      sectionColours:
        type: array
        items:
          type: string
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            The default changes: unset, section and task names are `textColor`. When set, it
            colours them by section band (D225); v12's `['#fff']` reached only the `tspan` fallback,
            which its default `fo` labels did not show.
      titleColor:
        description: Color of the title text in Journey Diagrams
        type: string
        default: ''
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            An unset (empty) value takes the theme's `textColor` (D248); v12 wrote an empty `fill`,
            black on dark themes.
      titleFontFamily:
        description: Font family to be used for the title text in Journey Diagrams
        type: string
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            The default changes: unset, it is the theme's `fontFamily`, as for every diagram
            type (D248). A set value takes effect.
      titleFontSize:
        description: Font size to be used for the title text in Journey Diagrams
        type: string
        default: '4ex'
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            `4ex` of the theme `fontSize` by default, as v12 (D248).

