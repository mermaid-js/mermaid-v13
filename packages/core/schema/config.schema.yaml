  SwimlaneDiagramConfig:
    title: Swimlane Diagram Config
    allOf: [{ $ref: '#/$defs/BaseDiagramConfig' }]
    description: |
      The object containing configurations specific for the swimlanes diagram type.

      Swimlanes reuses the flowchart renderer and flowchart config for shared
      options (curve, htmlLabels, spacing, …); this block holds the knobs that
      only affect the swimlanes layout pipeline.
    type: object
    unevaluatedProperties: false
    properties:
      theme:
        $ref: '#/$defs/BaseDiagramConfig/properties/theme'
        default: 'redux-color'
        x-mermaid: { status: pending }
      look:
        $ref: '#/$defs/BaseDiagramConfig/properties/look'
        x-mermaid:
          status: ignored
          since: 13.0.0
          reason: >-
            `look` is removed (D153): ignored, with one `LOOK_REMOVED` warning per render,
            whatever the diagram section.
          replacement: '`theme`, or the geometry and `dropShadow` theme variables'
      layout:
        $ref: '#/$defs/BaseDiagramConfig/properties/layout'
        # Swimlanes differ from flowcharts only in the layout engine, so the engine is the
        # diagram type. Declared here, not forced by the renderer, so an override still wins.
        default: 'swimlane'
        x-mermaid: { status: pending }
      lineHops:
        description: |
          Renders edge crossings as small arcs ("hops") or visible gaps so that
          overlapping edges are easier to read. Set to `false` to disable. Edges
          rendered as curves are skipped to avoid corrupting the geometry.
        oneOf:
          - type: boolean
          - type: string
            enum: ['arc', 'gap']
        default: 'arc'
        x-mermaid: { status: pending }
      ignoreCrossLaneEdges:
        description: |
          Ignores edges that cross swimlane boundaries during swimlane layer
          assignment. This can improve rank quality for diagrams with many
          cross-lane links.
        type: boolean
        default: true
        x-mermaid: { status: pending }
      optimizeRanksByCrossings:
        description: |
          Enables a crossing-aware rank optimization pass for swimlane layouts.
        type: boolean
        default: true
        x-mermaid: { status: pending }
      automaticLaneOrdering:
        description: |
          Automatically reorders top-level swimlanes with a deterministic
          weighted-linear-arrangement heuristic. Disabled by default because
          source swimlane order can carry semantic meaning.
        type: boolean
        default: false
        x-mermaid: { status: pending }

  AgentflowDiagramConfig:
    title: Agentflow Diagram Config
    allOf: [{ $ref: '#/$defs/BaseDiagramConfig' }]
    description: |
      The object containing configurations specific for the agentflow diagram type.

      Agentflow renders through the shared unified renderer, so it owns the same
      spacing and padding knobs a flowchart does. They live in their own block so
      that agentflow can be tuned without moving every flowchart on the page.
    type: object
    unevaluatedProperties: false
    properties:
      theme:
        $ref: '#/$defs/BaseDiagramConfig/properties/theme'
        default: 'redux-color'
        x-mermaid: { status: pending }
      look:
        $ref: '#/$defs/BaseDiagramConfig/properties/look'
        x-mermaid:
          status: ignored
          since: 13.0.0
          reason: >-
            `look` is removed (D153): ignored, with one `LOOK_REMOVED` warning per render,
            whatever the diagram section.
          replacement: '`theme`, or the geometry and `dropShadow` theme variables'
      titleTopMargin:
        description: Margin top for the text over the diagram
        type: integer
        minimum: 0
        default: 25
        x-mermaid: { status: pending }
      diagramPadding:
        description: |
          The amount of padding around the diagram as a whole so that embedded
          diagrams have margins, expressed in pixels.
        type: integer
        minimum: 0
        default: 8
        x-mermaid: { status: pending }
      nodeSpacing:
        description: |
          Defines the spacing between nodes on the same level.

          Pertains to horizontal spacing for TB (top to bottom) or BT (bottom to top) graphs,
          and the vertical spacing for LR as well as RL graphs.
        type: integer
        minimum: 0
        default: 50
        x-mermaid: { status: pending }
      rankSpacing:
        description: |
          Defines the spacing between nodes on different levels.

          Pertains to vertical spacing for TB (top to bottom) or BT (bottom to top), and the
          horizontal spacing for LR as well as RL graphs.
        type: integer
        minimum: 0
        default: 50
        x-mermaid: { status: pending }
      wrappingWidth:
        description: |
          Width of nodes where text is wrapped.

          When using markdown strings the text is wrapped automatically, this
          value sets the max width of a text before it continues on a new line.
        type: number
        default: 120
        x-mermaid: { status: pending }
      minNodeWidth:
        description: |
          Minimum width of the label area of a node.

          Labels narrower than this are widened to it, so nodes with short text
          get a uniform width; the node's own padding is added on top, the same
          way it is for `wrappingWidth`. Nodes with an explicit width are not
          affected.
        type: number
        default: 120
        x-mermaid: { status: pending }

  FlowchartDiagramConfig:
    title: Flowchart Diagram Config
    allOf: [{ $ref: '#/$defs/BaseDiagramConfig' }]
    description: The object containing configurations specific for flowcharts
    type: object
    unevaluatedProperties: false
    required:
      - titleTopMargin
      - subGraphTitleMargin
      - diagramPadding
      - nodeSpacing
      - rankSpacing
      - curve
      - useMaxWidth
      - wrappingWidth
      - minNodeWidth
    properties:
      theme:
        $ref: '#/$defs/BaseDiagramConfig/properties/theme'
        default: 'redux-color'
        x-mermaid: { status: pending }
      look:
        $ref: '#/$defs/BaseDiagramConfig/properties/look'
        x-mermaid:
          status: ignored
          since: 13.0.0
          reason: >-
            `look` is removed (D153): ignored, with one `LOOK_REMOVED` warning per render. The
            redux themes carry v12's `look: neo` geometry (D152).
          replacement: '`theme`, or the geometry and `dropShadow` theme variables'
      layout:
        $ref: '#/$defs/BaseDiagramConfig/properties/layout'
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            No flowchart default, as in v12: the top-level `layout` applies, `layered` (D127,
            R-LAYOUT-7: ELK is never the default). Set here, it wins for flowcharts. `elk` and
            `elk.<algorithm>` are drawn by `@mermaid-js/layout-elk` once it is registered; without
            it they draw with `layered` and add one `ELK_NOT_INSTALLED` warning (D173).
      titleTopMargin:
        $ref: '#/$defs/GitGraphDiagramConfig/properties/titleTopMargin'
        default: 25
        x-mermaid: { status: pending }
      subGraphTitleMargin:
        description: |
          Defines a top/bottom margin for subgraph titles
        type: object
        properties:
          top:
            type: integer
            minimum: 0
            x-mermaid: { status: pending }
          bottom:
            type: integer
            minimum: 0
            x-mermaid: { status: pending }
        default:
          top: 0
          bottom: 0
        x-mermaid: { status: pending }
      arrowMarkerAbsolute:
        type: boolean # TODO, is this actually used here (it has no default value but was in types)
        x-mermaid:
          status: ignored
          since: 13.0.0
          reason: Arrowheads are inline paths, not `<marker>` references.
      diagramPadding:
        $ref: '#/$defs/ErDiagramConfig/properties/diagramPadding'
        default: 8
        x-mermaid: { status: honoured, since: 13.0.0 }
      htmlLabels:
        description: |
          **DEPRECATED: Use global `htmlLabels` instead.**

          Flag for setting whether or not a html tag should be used for rendering labels on nodes and edges.
          This property is deprecated.
          Please use the global `htmlLabels` configuration instead.
        type:
          - boolean
          - 'null'
        deprecated: true
        default: null
        x-mermaid:
          status: removed
          since: 13.0.0
          reason: Labels are SVG text only; there is no HTML label mode (D5).
          replacement: none; labels support a markdown subset rendered as SVG text
      nodeSpacing:
        description: |
          Defines the spacing between nodes on the same level

          Pertains to horizontal spacing for TB (top to bottom) or BT (bottom to top) graphs,
          and the vertical spacing for LR as well as RL graphs.
        type: integer
        default: 50
        minimum: 0
        x-mermaid: { status: honoured, since: 13.0.0 }
      rankSpacing:
        description: |
          Defines the spacing between nodes on different levels

          Pertains to horizontal spacing for TB (top to bottom) or BT (bottom to top) graphs,
          and the vertical spacing for LR as well as RL graphs.
        type: integer
        default: 50
        minimum: 0
        x-mermaid: { status: honoured, since: 13.0.0 }
      curve:
        description: |
          Defines how mermaid renders curves for flowcharts.
        type: string
        enum:
          [
            'basis',
            'bumpX',
            'bumpY',
            'cardinal',
            'catmullRom',
            'linear',
            'monotoneX',
            'monotoneY',
            'natural',
            'step',
            'stepAfter',
            'stepBefore',
            'rounded',
          ]
        default: 'rounded'
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            The default changes from `basis` to `rounded`, the look of v12's default ELK layout:
            stepped routes whose corners are arcs of radius 5 (less on a short leg). Set `basis`
            to keep S-curves. `linear` draws straight segments; `step`, `stepBefore` and `stepAfter` draw stepped
            routes; `rounded` draws straight segments with rounded corners; every other value draws
            S-curves (the layout engine routes edges, not a d3 curve factory).

      padding:
        description: |
          Represents the padding between the labels and the shape

          **Only used in new experimental rendering.**
        type: number
        default: 15
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            The "padding" of the classic themes' node, stadium, hexagon, double-circle and
            circle padding variables (D151, D152), and of the diamond in every theme (side =
            label width + label height + 2 × padding). The redux themes use their own fixed
            padding variables (see `themeVariables`); a padding variable set to `padding` or
            `<n> * padding` follows this value in any theme.
      wrappingWidth:
        description: |
          Width of nodes where text is wrapped.

          When using markdown strings the text is wrapped automatically, this
          value sets the max width of a text before it continues on a new line.
        type: number
        default: 120
        x-mermaid: { status: honoured, since: 13.0.0 }
      minNodeWidth:
        description: |
          Minimum width of the label area of a node.

          Labels narrower than this are widened to it, so nodes with short text
          get a uniform width; the node's own padding is added on top, the same
          way it is for `wrappingWidth`. Nodes with an explicit width are not
          affected.
        type: number
        default: 120
        x-mermaid: { status: honoured, since: 13.0.0 }

      stepDuration:
        description: |
          Seconds the travelling dot spends on each step of the step-by-step
          flow animation (edges with a `step` number). Diagrams without `step`
          edges are not affected.
        type: number
        exclusiveMinimum: 0
        default: 1
        x-mermaid: { status: pending }

      stepNumbers:
        description: |
          If true, each edge with a `step` number shows that number in a small
          badge, so the order of the step-by-step flow can be read without
          watching the animation.
        type: boolean
        default: false
        x-mermaid: { status: pending }

      inheritDir:
        type: boolean
        default: false
        description: |
          If true, subgraphs without explicit direction will inherit the global graph direction
          (e.g., LR, TB, RL, BT). Defaults to false to preserve legacy layout behavior.
        x-mermaid: { status: honoured, since: 13.0.0 }

  SankeyLinkColor:
    description: |
