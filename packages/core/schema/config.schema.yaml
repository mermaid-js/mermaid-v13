      status: honoured
      since: 13.0.0
      reason: 'As in v12, a `fontFamily` set by `initialize()` or diagram text also sets `themeVariables.fontFamily`, which drawing and measuring use.'
  altFontFamily:
    # TODO: seems to be unused, except for in tests
    type: string
    x-mermaid:
      status: ignored
      since: 13.0.0
      reason: Unused by every renderer, also in v12.
  logLevel:
    description: |
      This option decides the amount of logging to be used by mermaid.
    type:
      - string
      - number
    enum:
      - trace
      - 0
      - debug
      - 1
      - info
      - 2
      - warn
      - 3
      - error
      - 4
      - fatal
      - 5
    meta:enum:
      trace: Equivalent to 0
      debug: Equivalent to 1
      info: Equivalent to 2
      warn: Equivalent to 3
      error: Equivalent to 4
      fatal: Equivalent to 5 (default)
    default: 5
    x-mermaid:
      status: ignored
      since: 13.0.0
      reason: v13 does not log; problems are returned in `RenderResult.warnings`.
  securityLevel:
    description: |
      Level of trust for parsed diagram. `default` allows `http`, `https`, `mailto` and
      relative link URLs; `strict` allows relative links only (R-SEC-4, R-SEC-6).
    type: string
    enum:
      - default
      - strict
      - loose
      - antiscript
      - sandbox
    meta:enum:
      default: (**default**) Link URLs may use `http`, `https`, `mailto` or be relative.
      strict: Only relative link URLs are kept; absolute links are dropped with a warning.
      antiscript: No longer supported; treated as `default`, with a warning.
      loose: No longer supported; treated as `default`, with a warning.
      sandbox: No longer supported; treated as `default`, with a warning.
    default: default
    x-mermaid:
      status: honoured
      since: 13.0.0
      reason: "The default changes from `strict` to the new level `default` (D48, D75), which keeps v12's absolute `http`/`https`/`mailto` links; `strict` now keeps relative links only, so an integrator who set `strict` explicitly loses absolute links (set `default` to keep them). `loose`, `antiscript` and `sandbox` act as `default` with a warning."
  startOnLoad:
    description: Dictates whether mermaid starts on Page load
    type: boolean
    default: true
    x-mermaid:
      status: honoured
      since: 13.0.0
      reason: As in v12, the browser build runs `run()` on `window` load unless `initialize()` turns this off.
  discovery:
    description: |
      Plugin auto-discovery (D164, D165): before the first render, `mermaid` registers the
      plugins found in the app's own `node_modules`, by the Node/SSR scan or, in a bundled
      app, by `@mermaid-js/bundler-plugin`'s build-time list. Set `false` to turn both off.
      It does not cover the CDN `globalThis.mermaidPlugins` queue (D167): a script that
      pushes itself there always registers. Integrator-only: diagram text cannot set it.
    type: boolean
    x-mermaid:
      status: honoured
      since: 13.0.0
      reason: 'New in v13. Integrator-only (`initialize()`); no default, so discovery is on unless this is `false`. Read once, at the first `prepare`, `render`, `parse` or `preload`.'
  cdnBase:
    description: |
      CDN build only (D163): the URL first-party chunks (diagrams, their text entries, themes)
      load from. Default: the directory `mermaid.esm.min.mjs` was loaded from. A relative URL
      resolves against `document.baseURI`; query and hash are dropped. A base other than that
      directory loads a second copy of the shared core chunks and warns: to move the whole
      build, put `data-cdn-base` on the `mermaid.min.js` tag instead. Integrator-only: diagram
      text cannot set it, so no URL in a diagram ever leads to a load (R-PLUG-7).
    type: string
    x-mermaid:
      status: honoured
      since: 13.0.0
      reason: 'New in v13. Integrator-only (`initialize()`); no default. Only a present key changes the base (`undefined` returns to the default); ignored outside the CDN build.'
  arrowMarkerAbsolute:
    # YAML anchor, can be used later with `*arrowMarkerAbsolute`
    &arrowMarkerAbsolute
    description: |
      Controls whether or arrow markers in html code are absolute paths or anchors.
      This matters if you are using base tag settings.
    type: boolean
    default: false
    x-mermaid:
      status: ignored
      since: 13.0.0
      reason: Arrowheads are inline paths, not `<marker>` references.
  secure:
    description: |
      This option controls which `currentConfig` keys are considered secure and
      can only be changed via call to `mermaid.initialize`.
      This prevents malicious graph directives from overriding a site's default security.
    default:
      [
        'secure',
        'securityLevel',
        'startOnLoad',
        'maxTextSize',
        'suppressErrorRendering',
        'maxEdges',
      ]
    type: array
    items:
      type: string
    uniqueItems: false # Should be enabled, but it may be a breaking change from the old config
    x-mermaid:
      status: honoured
      since: 13.0.0
  legacyMathML:
    description: |
      This option specifies if Mermaid can expect the dependent to include KaTeX stylesheets for browsers
      without their own MathML implementation. If this option is disabled and MathML is not supported, the math
      equations are replaced with a warning. If this option is enabled and MathML is not supported, Mermaid will
      fall back to legacy rendering for KaTeX.
    type: boolean
    default: false
    x-mermaid:
      status: ignored
      since: 13.0.0
      reason: >-
        v13 never emits MathML or KaTeX HTML (D175): a math extension typesets `$$…$$` TeX into
        SVG paths.
  forceLegacyMathML:
    description: |
      This option forces Mermaid to rely on KaTeX's own stylesheet for rendering MathML. Due to differences between OS
      fonts and browser's MathML implementation, this option is recommended if consistent rendering is important.
      If set to true, ignores legacyMathML.
    type: boolean
    default: false
    x-mermaid:
      status: ignored
      since: 13.0.0
      reason: >-
        v13 never emits MathML or KaTeX HTML (D175): a math extension typesets `$$…$$` TeX into
        SVG paths.
  deterministicIds:
    description: |
      This option controls if the generated ids of nodes in the SVG are
      generated randomly or based on a seed.
      If set to `false`, the IDs are generated based on the current date and
      thus are not deterministic. This is the default behavior.

      This matters if your files are checked into source control e.g. git and
      should not change unless content is changed.
    type: boolean
    default: false
    x-mermaid:
      status: honoured
      since: 13.0.0
      reason: v13 output ids never depend on the clock. With this set, each `run()` numbers its diagrams `mermaid-<n>` from the length of `deterministicIDSeed`, as v12 did; otherwise the count continues across calls.
  deterministicIDSeed:
    description: |
      This option is the optional seed for deterministic ids.
      If set to `undefined` but deterministicIds is `true`, a simple number iterator is used.
      You can set this attribute to base the seed on a static string.
    type: string
    x-mermaid:
      status: honoured
      since: 13.0.0
      reason: As in v12, only its length is used, as the first `run()` diagram number when `deterministicIds` is set.
