  GitGraphDiagramConfig:
    title: Git Graph Diagram Config
    allOf: [{ $ref: '#/$defs/BaseDiagramConfig' }]
    type: object
    unevaluatedProperties: false
    required:
      - titleTopMargin
    properties:
      theme:
        $ref: '#/$defs/BaseDiagramConfig/properties/theme'
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            Set here, it wins over the top-level `theme` for git graphs (a diagram section beats
            the top level within a config layer).
      useWidth:
        $ref: '#/$defs/BaseDiagramConfig/properties/useWidth'
        x-mermaid:
          status: ignored
          since: 13.0.0
          reason: Only v12's gantt renderer read `useWidth`; the gitGraph renderer never did.
      useMaxWidth:
        $ref: '#/$defs/BaseDiagramConfig/properties/useMaxWidth'
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            As v12 (default true): `width="100%"` and a `max-width`; `false` gives the drawing's
            own width and height.
      titleTopMargin:
        # TODO: I've removed the `Git` part from this description, so that I
        # could $ref: "#/$defs/GitGraphDiagramConfig/properties/titleTopMargin"
        # this field in other diagrams
        description: Margin top for the text over the diagram
        type: integer
        default: 25
        minimum: 0
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            As v12: a `title` (in the text or front matter, D265) has its baseline this far
            above the drawing. A value that is not a number of at least 0 warns
            `GIT_CONFIG_IGNORED` and draws with 25.
      diagramPadding:
        type: number
        default: 8
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            As v12: the room around the drawing in the viewBox. A value that is not a number of
            at least 0 warns `GIT_CONFIG_IGNORED` and draws with 8.
      nodeLabel:
        allOf: [{ $ref: '#/$defs/NodeLabel' }]
        type: object
        default:
          width: 75
          height: 100
          x: -25
          y: 0
        x-mermaid:
          status: ignored
          since: 13.0.0
          reason: >-
            v12's gitGraph never read it.
      mainBranchName:
        type: string
        default: 'main'
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            As v12: the name of the branch the graph starts on. The language service reads it
            from the document's front matter and `init` directives (the site config is not in
            the text).
      mainBranchOrder:
        type: number
        default: 0
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            As v12: the main branch's place among the branches' `order:` values.
      showCommitLabel:
        type: boolean
        default: true
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            As v12: `false` draws no commit ids.
      showBranches:
        type: boolean
        default: true
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            As v12: `false` draws no branch lines and labels; each lane keeps its (empty) group.
      rotateCommitLabel:
        type: boolean
        default: true
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            As v12: commit ids at −45 degrees (LR, TB and BT), with 40 px more between the
            lanes.
      parallelCommits:
        type: boolean
        default: false
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            As v12: a commit is placed one step after its latest parent, so branches run side
            by side, not in written order.
      # YAML anchor reference, don't use $ref since ajv doesn't load defaults
      arrowMarkerAbsolute: *arrowMarkerAbsolute

