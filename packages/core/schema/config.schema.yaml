        type: integer
        default: 15
        minimum: 0
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            The padding inside every entity table cell, in px, across and down, in place of the
            layout's node padding (D116). Text output keeps its 1-cell padding.
      nodeSpacing:
        type: integer
        default: 140
        minimum: 0
        x-mermaid: { status: honoured, since: 13.0.0 }
      rankSpacing:
        type: integer
        default: 80
        minimum: 0
        x-mermaid: { status: honoured, since: 13.0.0 }
      stroke:
        description: Stroke color of box edges and lines.
        type: string
        default: gray
        x-mermaid:
          status: ignored
          since: 13.0.0
          reason: >-
            mermaid 12.2.0 does not read it either; only the legacy ER renderer, no longer used,
            did.
          replacement: '`themeVariables.nodeBorder` and `lineColor`'
      fill:
        description: Fill color of entity boxes
        type: string
        default: honeydew
        x-mermaid:
          status: ignored
          since: 13.0.0
          reason: >-
            mermaid 12.2.0 does not read it either; only the legacy ER renderer, no longer used,
            did.
          replacement: '`themeVariables.mainBkg`'
      fontSize:
        description: Font size (expressed as an integer representing a number of pixels)
