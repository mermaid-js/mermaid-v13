          top: 0
          bottom: 0
        x-mermaid: { status: pending }
      arrowMarkerAbsolute:
        type: boolean # TODO, is this actually used here (it has no default value but was in types)
        x-mermaid:
          status: ignored
          since: 13.0.0
          reason: Arrowheads are inline paths, not `<marker>` references.
      diagramPadding:
        $ref: '#/$defs/ErDiagramConfig/properties/diagramPadding'
        default: 8
