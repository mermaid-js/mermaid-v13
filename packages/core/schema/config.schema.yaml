# Used for VS Code's YAML plugin to automatically error on invalid types
# yaml-language-server: $schema=https://json-schema.org/draft/2019-09/schema

# The MermaidConfig JSON Schema, moved here from v12's
# `packages/mermaid/src/schemas/config.schema.yaml`. It is the single source of truth
# for config (R-CONF-4, D60). `pnpm gen:config` generates from it:
#   - `packages/core/src/config/generated/config.type.ts`: the `MermaidConfig` types
#   - `packages/core/src/config/generated/defaults.ts`: top-level defaults
#   - `packages/core/src/config/generated/keys.ts`: the key tree resolveConfig checks against
#   - `packages/diagram-<type>/src/generated/config-defaults.ts`: each ported diagram's section
#   - `v13/docs/config-reference.md` and the config section of `v13/docs/MIGRATION.md`
# `pnpm check` fails when any of them is stale or a key lacks an annotation.
#
# Every key under any `properties:` carries an `x-mermaid` annotation:
#   status: honoured | ignored | pending | removed | moved
#     honoured  v13 implements it
#     ignored   accepted, has no effect in v13 (give `reason`)
#     pending   accepted, honoured once its diagram type or feature lands (R-CONF-5)
#     removed   warns and is dropped (give `reason` or `replacement`); left out of the types
#     moved     warns; lives in the package named by `movedTo`
#   since, movedTo, replacement, reason: optional strings
# A key reached through a YAML alias shares its anchor's annotation.
#
# Useful things to know when editing this file
# - Use the `|` character for multi-line strings
# - Use `meta:enum` to document enum values
# - Use `tsType` to override the TypeScript type (from json-schema-to-typescript)
$id: https://mermaid.js.org/schemas/config.schema.json
$schema: https://json-schema.org/draft/2019-09/schema
title: Mermaid Config
type: object
additionalProperties: false
required:
  - fontFamily
  - logLevel
  - securityLevel
  - startOnLoad
  - arrowMarkerAbsolute
  - flowchart
  - sequence
  - gantt
  - journey
  - class
  - state
  - er
  - pie
  - quadrantChart
  - xyChart
  - requirement
  - architecture
  - mindmap
  - kanban
  - gitGraph
  - c4
  - sankey
  - packet
  - block
  - treeView
  - look
  - eventmodeling
  - radar
  - usecase
  - venn
properties:
  theme:
    # The diagram sections' enum plus v13's `auto`, which is a whole-diagram choice only
    # (so v12's per-diagram `theme` types are unchanged).
    description: |
      Theme, the CSS style sheet.
      You may also use `themeCSS` to override this value.
    type: string
    enum:
      - default
      - base
      - dark
      - forest
      - neutral
      - neo
      - neo-dark
      - redux
      - redux-dark
      - redux-color
      - redux-dark-color
      - auto
      - 'null'
    meta:enum:
      'null': Can be set to disable any pre-defined mermaid theme
      auto: 'New in v13: the default theme, and `dark` under `prefers-color-scheme: dark` (R-THEME-8)'
    default: 'redux-color'
    x-mermaid:
      status: honoured
      since: 13.0.0
      reason: >-
        The default changes from `default` to `redux-color`, the theme v12's flowchart renders by
        default (D151, amending D55). 13.0 ships the redux family (`redux`, `redux-color`,
        `redux-dark`, `redux-dark-color`) as real themes, plus `default`, `dark`, `forest`,
        `neutral`, `base`, `neo` (v12 `theme-neo.js`, D180, D181) and `neo-dark` (v12
        `theme-neo-dark.js`, cleaned up into a dark theme, D183). `null` renders `base`, with a
        `THEME_UNAVAILABLE` warning.
  themeVariables:
    tsType: any
    x-mermaid:
      status: honoured
      since: 13.0.0
      reason: >-
        Exposed as `--mermaid-<name>` CSS variables (see theme-variables.md). Every difference
        between the redux and classic theme families is a theme variable (D152), listed here as
        redux / classic value: `borderColorArray` Tailwind-400 × 12 in `redux-color` and
        `redux-dark-color` / none; `bkgColorArray` Tailwind-50 × 12 in `redux-color`, empty in
        `redux-dark-color` / none; `arrowheadGap` 4 / 0; `arrowheadLength` 10.5 / 8;
        `arrowheadWidth` ≈12.8 / 8; `circleArrowheadSize` 14 / 11; `circleArrowheadGap` ≈3.15 /
        ≈1.1; `crossArrowheadSize` 10.4 / 9; `crossArrowheadGap` ≈2.96 / ≈2;
        `crossArrowheadStrokeWidth` 2 / 2; `erZeroOrMoreCircleOffset` 28 / 30; `rowOdd` and
        `rowEven` the entity fill (`mainBkg`) / v12's lightened `mainBkg`; `erEdgeLabelBackground`
        white (`redux-color`) or `#16141f` (`redux-dark-color`), else `edgeLabelBackground`;
        `erMarkerFill` `mainBkg` / white; `nodePaddingX` (per side) 16 / 2 × padding;
        `nodePaddingY` (per side) 12 / padding; `stadiumPaddingX` (total) 40 / padding;
        `stadiumPaddingY` (total) 24 / padding; `hexagonPaddingX` 70 / padding;
        `hexagonPaddingY` 32 / padding; `hexagonSlant` 3.5 / 4; `doubleCircleGap` 12 / 5;
        `doubleCirclePadding` 16 / padding; `circlePadding` 16 / padding; `circleMinDiameter` 44 /
        none; `subroutinePaddingX` / `subroutinePaddingY` (totals) 28 / 12 and padding;
        `cylinderPaddingX` / `cylinderPaddingY` (totals) 24 and padding; `leanPaddingX` /
        `leanPaddingY` (totals) 2 × padding / padding and padding; `oddPaddingX` / `oddPaddingY`
        (totals) 42 / 24 and padding; `actorRadius` 6 / 3; `actorGlyphBand` 44 / 0;
        `messageEndGap` 3 / 0; `labelBoxExtraHeight` 15 / 0; `actorFooterPadding` 30 / 0; timeline `timelineRadius` 0 / 5, `timelineLabelOffset` padding / 0.5 × padding, `timelineEventLabelShift` 3 / 0, `timelineScaleColors` false / true (the neo themes take the classic timeline values, D227); gitGraph `gitCommitRadius` 7 / 10, `gitLaneShift` 9 / 0, `gitBranchLabelPaddingX` / `gitBranchLabelPaddingY` 16 / 12 and 0, `gitBranchLabelRadius` 0 / 4, `gitBranchLabelShiftX` 11 / 0, `gitBranchLabelOffsetY` 22 / 0, `gitArrowWidth` 2 / 8, `gitHighlightInnerSize` 8 / 12, `gitMergeRadius` 5 / 6, `gitReverseCrossSize` 4 / 5, `gitCherryPickDotRadius` 2.5 / 2.75, `gitPaletteColors` false / true, `commitLineColor` `#BDBCCC` / `lineColor` (the neo themes take the classic gitGraph values, D266), `gitNodeColors` true / false (true in the neo themes); `dropShadow` `drop-shadow(4px 4px 0 rgb(0 0 0 / 0.06))` (white instead of black
        on the dark redux themes) / `none`; `compositeBackground` `background` (`#16141f` on the dark redux themes) / `background`; `compositeTitleBackground` `#f9f9fb` (`#16141f` on the dark redux
        themes) / `mainBkg`; `altBackground` `#f9f9fb` (`#16141f`) / `#f0f0f0` (`#555555` in `dark`,
        `#f4f4f4` in `neutral`, `tertiaryColor` in `base`); `classText` `textColor` / `primaryTextColor`; class markers
        `classMarkerStrokeWidth` 2 / 1, `classFilledMarkerStrokeWidth` 0 / 1,
        `extensionMarkerLength` 8 / 17, `extensionMarkerGap` 8.25 / 0.25, `compositionMarkerGap`
        2.75 / 0.25, `dependencyMarkerGap` 4 / 1. `classTerminalFontSize` (class multiplicities)
        is 11 in every theme. The quadrant chart's 15 colours (`quadrant1Fill`–`quadrant4Fill`,
        `quadrant1TextFill`–`quadrant4TextFill`, `quadrantPointFill`, `quadrantPointTextFill`,
        `quadrantXAxisTextFill`, `quadrantYAxisTextFill`, `quadrantInternalBorderStrokeFill`,
        `quadrantExternalBorderStrokeFill`, `quadrantTitleFill`) follow v12's rules in every
        theme: `quadrant1Fill` `#ececfe` in `redux`, `redux-color` and `neo` / `primaryColor`;
        fills 2–4 add 5, 10 and 15 to each RGB channel of `quadrant1Fill` and text fills 2–4 take
        5, 10 and 15 off `primaryTextColor` (D232); `quadrantPointFill` `textColor` (D231); the
        other text fills `primaryTextColor`; both borders `primaryBorderColor`. The XY chart's 13
        (`xyChartBackgroundColor`, `xyChartTitleColor`, `xyChartDataLabelColor`,
        `xyChartLegendTextColor`, the x and y axis `TitleColor`, `LabelColor`, `TickColor` and
        `LineColor`, `xyChartPlotColorPalette`; nested as v12's `xyChart.*`) are the same rules in
        both families: the background `background`, the other colours `primaryTextColor`, the
        palette `plotColorArray` (each theme's own ten, D381). "padding" is `flowchart.padding`. Plain `redux` and
        `redux-dark` carry no per-subgraph palette; every theme carries v12's `cScale`,
        `cScaleInv` and `cScaleLabel` (D258). `neo` carries the redux values of the geometry, ER and
        `classText` variables (v12 `look: neo`, D181) and no per-subgraph palette, with its own corner
        (`radius` 3) and shadow (`drop-shadow(0 1px 2px rgb(0 0 0 / 0.25))`); `neo-dark` the
        same, with `drop-shadow(1px 2px 2px rgb(185 185 185 / 0.2))`. Geometry variables are read as numbers at render time,
        because they feed layout, so overriding their CSS variables has no effect;
        `dropShadow` is a CSS value.
    # Named variables are documented here; any other name is still accepted (R-CONF-5).
    type: object
    additionalProperties: true
    properties:
      borderColorArray:
        description: |
          Per-subgraph border colours, used by slot (declaration order, cycling). A list of
          colours, or one comma-separated string. Empty or unset: no per-subgraph colour.
        type: [array, string]
        items:
          type: string
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            Tailwind-400 × 12 in `redux-color` and `redux-dark-color`; empty in every other
            theme (D151). Read as literal colours, not CSS variables. An unsafe colour drops
            the whole list with `THEME_VARIABLE_DROPPED`.
      bkgColorArray:
        description: |
          Per-subgraph fill colours, by the same slot as `borderColorArray`. A list of colours,
          or one comma-separated string. Empty: subgraphs are coloured on the border only.
        type: [array, string]
        items:
          type: string
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            Tailwind-50 × 12 in `redux-color`; empty in `redux-dark-color` and every other theme
            (D151). Read as literal colours, not CSS variables. An unsafe colour drops the whole
            list with `THEME_VARIABLE_DROPPED`.
      cScale:
        description: |
          The section colour scale (timeline, mindmap), twelve slots. A list of colours, or one
          comma-separated string; `cScale0`–`cScale11` replace one slot.
        type: [array, string]
        items:
          type: string
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            Every theme carries v12's values (D258): derived from `primaryColor`,
            `secondaryColor` and `tertiaryColor` by hue steps and khroma `darken` in `base`
            (25, 75 under `darkMode`), `forest` (10), `neo-dark` and `redux-dark` (25), from
            `mainBkg` in `redux`; fixed lists in `default`, `dark` (slot 0 is `primaryColor`),
            `neutral`, `neo` and the colour themes (Tailwind-300). Read as literal colours, not
            CSS variables. An unsafe colour drops that override with `THEME_VARIABLE_DROPPED`.
            The timeline paints with it only where `timelineScaleColors` is true and the gradient
            is off: an override changes nothing in the redux themes (the default `redux-color`
            included), `theme: 'auto'`, `neo` or `neo-dark`, as v12's redux and neo timeline paint
            ignored it (D227, D257); v12's default theme was `default`.
      cScaleInv:
        description: |
          The colour drawn against each `cScale` slot (the timeline's rule under a box), twelve
          slots. A list of colours, or one comma-separated string; `cScaleInv0`–`cScaleInv11`
          replace one slot.
        type: [array, string]
        items:
          type: string
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            v12's values in every theme (D258): the inverse of the slot (a half turn of hue in
            `forest`), fixed in `default`. Where v12 inverts the slot before it applies an author's
            `cScale<n>`, so does v13. Read as literal colours, not CSS variables. The timeline
            draws it only where `timelineScaleColors` is true and the gradient is off: an override
            changes nothing in the redux themes (the default `redux-color` included),
            `theme: 'auto'`, `neo` or `neo-dark` (v12's redux and neo paint, D227, D257).
      cScaleLabel:
        description: |
          Text colour on each `cScale` slot, twelve slots. A list of colours, or one
          comma-separated string; `cScaleLabel0`–`cScaleLabel11` replace one slot.
        type: [array, string]
        items:
          type: string
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            v12's values in every theme (D258): `labelTextColor` in most themes, with slots 0 and
            3 inverted in `default`, slots 0 and 2 `cScale1` in `neutral`, black under `darkMode`
            in `dark` and `neutral`, and each slot darkened by 75 in `redux-dark-color`. Read as
            literal colours, not CSS variables. The timeline reads it only where
            `timelineScaleColors` is true: an override changes nothing in the redux themes (the
            default `redux-color` included) or `theme: 'auto'`; in `neo` and `neo-dark` it is the
            box text and (slot 11) the axis and connectors (v12's redux and neo paint, D227, D257).
      git:
        description: |
          gitGraph branch colours (commit bullets, branch lines, arrows, label backgrounds), eight
          slots. A list of colours, or one comma-separated string; `git0`–`git7` replace one slot.
        type: [array, string]
        items:
          type: string
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            v12's values in every theme (D267): `primaryColor`, `secondaryColor`, `tertiaryColor`
            and the primary turned by −30, −60, −90, 60 and 120 degrees, darkened by 25 (lightened
            under `darkMode`) in `base`, `forest`, `redux-dark` and `redux-dark-color`; the same
            steps from fixed colours in `neo`, `redux` and `redux-color`; the dark pie colours
            lightened by 25 in `neo-dark`; `cScale2`–`cScale8` (v12's `pie2`–`pie8`, D334)
            lightened in `dark` and as given in `neutral`; fixed in `default`. Read as literal colours, not CSS variables. An unsafe
            colour drops that override with `THEME_VARIABLE_DROPPED`.
      gitInv:
        description: |
          gitGraph highlight colour against each `git` slot, eight slots. A list of colours, or one
          comma-separated string; `gitInv0`–`gitInv7` replace one slot.
        type: [array, string]
        items:
          type: string
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            v12's values in every theme (D267): the inverse of the slot (darkened by 25 in slot 0 of
            `default`). Where v12 steps an author's `git<n>` before it inverts it, so does v13;
            `default`, `dark` and `neutral` ignore it, as in v12. Read as literal colours, not CSS
            variables.
      gitBranchLabel:
        description: |
          gitGraph branch label text colour on each `git` slot, eight slots. A list of colours, or
          one comma-separated string; `gitBranchLabel0`–`gitBranchLabel7` replace one slot.
        type: [array, string]
        items:
          type: string
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            v12's values in every theme (D267): `labelTextColor` (black under `darkMode`) in `base`,
            `neo`, `neo-dark` and the redux themes; slots 0 and 3 inverted in `default` (fixed),
            `forest` (from `actorTextColor`) and `dark`; slots 1 and 3 white in `neutral`. v12's
            `branchLabelColor` is not read: set `gitBranchLabel`. Read as literal colours, not CSS
            variables.
      THEME_COLOR_LIMIT:
        description: |
          v12's number of colour-scale slots.
        type: number
        x-mermaid:
          status: ignored
          since: 13.0.0
          reason: >-
            The numbered `cScale` palettes always have twelve slots and the git palettes eight, and
            a diagram cycles through them (D258, D267).
      commitLabelColor:
        description: |
          gitGraph commit label text.
        type: string
        x-mermaid: &gitLabel
          status: honoured
          since: 13.0.0
          reason: >-
            gitGraph label variable (D267), derived as each v12 theme derives it:
            `commitLabelColor` the author's `secondaryTextColor`, else v12's inverse of the
            theme's `secondaryColor`; `commitLabelBackground` `secondaryColor`; `tagLabelColor`
            `primaryTextColor`; `tagLabelBackground` `primaryColor`; `tagLabelBorder` the author's
            `tagBorder`, else `primaryBorderColor`; both font sizes 10px. `default` fixes all but
            the border, as v12 does.
      commitLabelBackground:
        description: |
          gitGraph commit label background.
        type: string
        x-mermaid: *gitLabel
      commitLabelFontSize:
        description: |
          gitGraph commit label font size in px.
        type: [number, string]
        x-mermaid: *gitLabel
      tagLabelColor:
        description: |
          gitGraph tag label text.
        type: string
        x-mermaid: *gitLabel
      tagLabelBackground:
        description: |
          gitGraph tag label background.
        type: string
        x-mermaid: *gitLabel
      tagLabelBorder:
        description: |
          gitGraph tag label outline. Wins over `tagBorder`.
        type: string
        x-mermaid: *gitLabel
      tagBorder:
        description: |
          v12's other name for `tagLabelBorder`, used when `tagLabelBorder` is not set. No theme
          sets it.
        type: string
        x-mermaid: *gitLabel
      tagLabelFontSize:
        description: |
          gitGraph tag label font size in px.
        type: [number, string]
        x-mermaid: *gitLabel
      arrowheadGap:
        description: |
          Space in px between a point arrowhead's tip and the node outline.
        type: [number, string]
        x-mermaid: &arrowhead
          status: honoured
          since: 13.0.0
          reason: >-
            Arrowhead geometry (D152): a number or a px length, redux / classic value in the
            `themeVariables` notes. Read as a number at render time, so overriding its CSS
            variable has no effect.
      arrowheadLength:
        description: |
          Length in px of a point arrowhead, from tip to base.
        type: [number, string]
        x-mermaid: *arrowhead
      arrowheadWidth:
        description: |
          Width in px of a point arrowhead's base.
        type: [number, string]
        x-mermaid: *arrowhead
      circleArrowheadSize:
        description: |
          Diameter in px of a circle arrowhead.
        type: [number, string]
        x-mermaid: *arrowhead
      circleArrowheadGap:
        description: |
          Space in px between a circle arrowhead and the node outline.
        type: [number, string]
        x-mermaid: *arrowhead
      crossArrowheadSize:
        description: |
          Side in px of the square a cross arrowhead's arms span.
        type: [number, string]
        x-mermaid: *arrowhead
      crossArrowheadGap:
        description: |
          Space in px between a cross arrowhead and the node outline.
        type: [number, string]
        x-mermaid: *arrowhead
      crossArrowheadStrokeWidth:
        description: |
          Stroke width in px of a cross arrowhead's arms.
        type: [number, string]
        x-mermaid: *arrowhead
      erZeroOrMoreCircleOffset:
        description: |
          ER diagrams: distance in px from the entity outline to the centre of the circle of a
          zero-or-more end.
        type: [number, string]
        x-mermaid: *arrowhead
      rowOdd:
        description: |
          ER diagrams: fill of the odd attribute rows of an entity (the first, third, …).
        type: string
        x-mermaid: &erColor
          status: honoured
          since: 13.0.0
          reason: >-
            ER theme variable (#133), redux / classic value in the `themeVariables` notes.
      rowEven:
        description: |
          ER diagrams: fill of the even attribute rows of an entity.
        type: string
        x-mermaid: *erColor
      erEdgeLabelBackground:
        description: |
          ER diagrams: background of relationship labels.
        type: string
        x-mermaid: *erColor
      erMarkerFill:
        description: |
          ER diagrams: fill of the circle of a zero-or-one and zero-or-more end.
        type: string
        x-mermaid: *erColor
      nodePaddingX:
        description: |
          Room left and right of a node label, per side, for the rectangle and the shapes that share its padding. A px number, or a multiple of `flowchart.padding` written `padding` or `<n> * padding`.
        type: [number, string]
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            16 in the redux themes; `2 * padding` in the classic themes. Read as a number at render time (D152), so its CSS variable has no effect.
      nodePaddingY:
        description: |
          Room above and below a node label, per side. A px number, or a multiple of `flowchart.padding` written `padding` or `<n> * padding`.
        type: [number, string]
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            12 in the redux themes; `padding` in the classic themes. Read as a number at render time (D152), so its CSS variable has no effect.
      stadiumPaddingX:
        description: |
          Stadium padding added to the width, in total. A px number, or a multiple of `flowchart.padding` written `padding` or `<n> * padding`.
        type: [number, string]
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            40 in the redux themes; `padding` in the classic themes. Read as a number at render time (D152), so its CSS variable has no effect.
      stadiumPaddingY:
        description: |
          Stadium padding added to the height, in total. A px number, or a multiple of `flowchart.padding` written `padding` or `<n> * padding`.
        type: [number, string]
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            24 in the redux themes; `padding` in the classic themes. Read as a number at render time (D152), so its CSS variable has no effect.
      hexagonPaddingX:
        description: |
          Hexagon padding added to the width, in total. A px number, or a multiple of `flowchart.padding` written `padding` or `<n> * padding`.
        type: [number, string]
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            70 in the redux themes; `padding` in the classic themes. v12 adds it to the height; v13 corrects the axes (D151). Read as a number at render time (D152), so its CSS variable has no effect.
      hexagonPaddingY:
        description: |
          Hexagon padding added to the height, in total. A px number, or a multiple of `flowchart.padding` written `padding` or `<n> * padding`.
        type: [number, string]
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            32 in the redux themes; `padding` in the classic themes. v12 adds it to the width; v13 corrects the axes (D151). Read as a number at render time (D152), so its CSS variable has no effect.
      hexagonSlant:
        description: |
          Hexagon slant factor: each pointed end is the height divided by this.
        type: number
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            3.5 in the redux themes; 4 in the classic themes. Read as a number at render time (D152), so its CSS variable has no effect.
      doubleCircleGap:
        description: |
          Gap between the two rings of a double circle.
        type: number
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            12 in the redux themes; 5 in the classic themes. Read as a number at render time (D152), so its CSS variable has no effect.
      doubleCirclePadding:
        description: |
          Room between the label diagonal and the inner ring of a double circle, per side. A px number, or a multiple of `flowchart.padding` written `padding` or `<n> * padding`.
        type: [number, string]
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            16 in the redux themes; `padding` in the classic themes. Read as a number at render time (D152), so its CSS variable has no effect.
      circlePadding:
        description: |
          Added to the label's diagonal to give a circle's diameter. A px number, or a multiple of `flowchart.padding` written `padding` or `<n> * padding`.
        type: [number, string]
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            16 in the redux themes (v13's earlier value, kept, D151); `padding` in the classic themes. Read as a number at render time (D152), so its CSS variable has no effect.
      circleMinDiameter:
        description: |
          The smallest circle diameter.
        type: number
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            44 in the redux themes; 0 (none) in the classic themes. Read as a number at render time (D152), so its CSS variable has no effect.
      subroutinePaddingX:
        description: |
          Subroutine padding added to the width, in total, inside its two 8px frames. A px number, or a multiple of `flowchart.padding` written `padding` or `<n> * padding`.
        type: [number, string]
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
