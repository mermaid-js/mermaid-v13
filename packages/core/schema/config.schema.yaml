      useMaxWidth:
        $ref: '#/$defs/BaseDiagramConfig/properties/useMaxWidth'
        x-mermaid: { status: honoured, since: 13.0.0 }
      textPosition:
        type: number
        minimum: 0
        maximum: 1
        description: |
          Axial position of slice's label from zero at the center to 1 at the outside edges.
        default: 0.75
        x-mermaid: { status: honoured, since: 13.0.0 }
      donutHole:
        type: number
        minimum: 0
        maximum: 0.9
        description: |
          Donut hole ratio. Valid value are from 0 to 0.9. Default to 0.
        default: 0
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: As in v12, a value outside (0, 0.9] draws no hole.
