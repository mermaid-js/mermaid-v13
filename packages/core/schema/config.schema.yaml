$defs:
  # JSON Schema definition (maybe we should move these to a separate file)
  BaseDiagramConfig:
    # TODO: More config needs to be moved here
    title: Base Diagram Config
    type: object
    properties:
      useWidth:
        type: number
        x-mermaid: { status: pending }
      useMaxWidth:
        description: |
          When this flag is set to `true`, the height and width is set to 100%
          and is then scaled with the available space.
          If set to `false`, the absolute space required is used.
        type: boolean
        default: true
        x-mermaid: { status: pending }
      # Declared here as well as at the top level so a diagram type can carry its own
      # default; the top-level properties `$ref` these, keeping the enums written once.
      # Resolution, highest first: frontmatter/directive, `initialize()`, this diagram
      # type's default, the top-level default. Diagram-scoped beats global within a layer.
      theme:
        description: |
          Theme, the CSS style sheet.
          You may also use `themeCSS` to override this value.
        type: string
        enum:
          - default
          - base
          - dark
          - forest
          - neutral
          - neo
          - neo-dark
          - redux
          - redux-dark
          - redux-color
          - redux-dark-color
          - 'null' # should this be a `null`-type?
        meta:enum:
          'null': Can be set to disable any pre-defined mermaid theme
        x-mermaid: { status: pending }
      look:
        description: |
          Defines which main look to use for the diagram.
        type: string
        enum:
          - classic
          - handDrawn
          - neo
        deprecated: true
        x-mermaid:
          status: ignored
          since: 13.0.0
          reason: >-
            `look` is removed (D153): ignored, with one `LOOK_REMOVED` warning per render,
            whatever the diagram section.
          replacement: '`theme`, or the geometry and `dropShadow` theme variables'
      layout:
        description: |
          Defines which layout algorithm to use for rendering the diagram.
        type: string
        x-mermaid: { status: pending }
  C4DiagramConfig:
    title: C4 Diagram Config
    allOf: [{ $ref: '#/$defs/BaseDiagramConfig' }]
    description: The object containing configurations specific for c4 diagrams
    type: object
    unevaluatedProperties: false
    required:
      - diagramMarginX
      - diagramMarginY
      - c4ShapeMargin
      - c4ShapePadding
      - width
      - height
      - boxMargin
      - useMaxWidth
      - c4ShapeInRow
      - c4BoundaryInRow
    properties:
      diagramMarginX:
        description: |
          Margin to the right and left of the c4 diagram, must be a positive value.
        type: integer
        default: 50
        minimum: 0
        x-mermaid: { status: pending }
      diagramMarginY:
        description: |
          Margin to the over and under the c4 diagram, must be a positive value.
        type: integer
        default: 10
        minimum: 0
        x-mermaid: { status: pending }
      c4ShapeMargin:
        description: Margin between shapes
        type: integer
        default: 50
        minimum: 0
        x-mermaid: { status: pending }
      c4ShapePadding:
        description: Padding between shapes
        type: integer
        default: 20
        minimum: 0
        x-mermaid: { status: pending }
      width:
        description: Width of person boxes
        type: integer
        default: 216
        minimum: 0
        x-mermaid: { status: pending }
      height:
        description: Height of person boxes
        type: integer
        default: 60
        minimum: 0
        x-mermaid: { status: pending }
      boxMargin:
        description: Margin around boxes
        type: integer
        default: 10
        minimum: 0
        x-mermaid: { status: pending }
      c4ShapeInRow:
        description: How many shapes to place in each row.
        type: integer
        default: 4
        minimum: 0
        x-mermaid: { status: pending }
      nextLinePaddingX:
        # TODO: add description
        type: number
        default: 0
        x-mermaid: { status: pending }
      c4BoundaryInRow:
        description: How many boundaries to place in each row.
        type: integer
        default: 2
        minimum: 0
        x-mermaid: { status: pending }

      # --------------------------------------------------------------------- #
      # Default font values
      # --------------------------------------------------------------------- #
      personFontSize:
        description: This sets the font size of Person shape for the diagram
        type: &fontSizeType ['string', 'number'] # YAML anchor
        default: 14
