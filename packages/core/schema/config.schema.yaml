    type: object
    tsType: "import('dompurify').Config"
    x-mermaid:
      status: removed
      since: 13.0.0
      reason: 'v13 has no HTML sanitizer: output is safe by construction (R-SEC-1).'
      replacement: none
  wrap:
    type: boolean
    x-mermaid: { status: pending }
  fontSize:
    type: number
    default: 16
    x-mermaid:
      status: honoured
      since: 13.0.0
      reason: >-
        Read by timeline, as v12's renderer read it: each box is `fontSize × 0.55` px taller
        than its text, and the TD axis starts `2 × fontSize` above the content and ends
        `0.5 × fontSize + 20` below it. Text is drawn at `themeVariables.fontSize`; no other
        type reads this key.
  markdownAutoWrap:
    type: boolean
    default: true
