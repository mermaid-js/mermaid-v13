  themeCSS:
    type: string
    x-mermaid:
      status: ignored
      since: 13.0.0
      reason: v13 output carries no author stylesheet (R-SEC-2).
      replacement: '`themeVariables`, or `--mermaid-*` CSS variables set by the host page'
  look:
    $ref: '#/$defs/BaseDiagramConfig/properties/look'
    x-mermaid:
      status: ignored
      since: 13.0.0
      reason: >-
        `look` is removed (D153): the key is accepted and ignored, with one `LOOK_REMOVED`
        warning per render. The v12 neo and classic geometry is theme data instead: the redux
        themes, `neo` and `neo-dark` carry neo geometry and the classic themes carry classic
        geometry (D152, D181).
      replacement: '`theme`, or the geometry and `dropShadow` theme variables; `handDrawn` comes from the hand-drawn plugin (R-PLUG-8)'
  layout:
    $ref: '#/$defs/BaseDiagramConfig/properties/layout'
    description: |
      Defines which layout algorithm to use for rendering the diagram.

      Defaults to `layered`, the layout engine built into core (DESIGN §6.1);
      mindmap defaults to `tree`, core's two-sided tidy tree, and maps v12's
      `cose-bilkent` and `tidy-tree` to it.
      The v12 name `dagre` is still accepted and maps to `layered`. `elk` and
      `elk.<algorithm>` need an ELK layout plugin; without one they draw with
      the diagram's default engine and warn `ELK_NOT_INSTALLED`. Text output
      (`format: 'ascii'`) always uses `layered`.
    default: 'layered'
    x-mermaid:
      status: honoured
      since: 13.0.0
      reason: "The default changes from `elk` to `layered`, the built-in engine (DESIGN §6.1). The v12 value `dagre` stays valid and maps to `layered` silently. `elk` and `elk.<algorithm>` (and the `flowchart-elk` header) are laid out by `@mermaid-js/layout-elk` once it is registered; without it they draw with `layered` and add one `ELK_NOT_INSTALLED` warning (D173). Other engines come in through `registerLayoutLoaders` (R-LAYOUT-2), and an unknown name falls back to `layered` with a `LAYOUT_UNKNOWN` warning. A diagram can name its own default engine (D284): mindmap lays out with `tree` (D280, loaded lazily) when no config layer sets `layout`, maps v12's `cose-bilkent` and `tidy-tree` to it silently (D282), honours `layered`, `dagre` and an installed `elk.*`, and draws an unknown or uninstalled name with `tree` and the same warnings; other diagrams do not reach `tree` (D285). Text output (`format: 'ascii'`) always lays out with `layered` and the cell profile, plugin or not: any other name gives one `ASCII_DROPPED` warning (`feature: 'layout'`) and nothing else, and its engine is never loaded (D179)."
  maxTextSize:
    description: The maximum allowed size of the users text diagram
    type: number
    default: 50000
    x-mermaid:
      status: honoured
      since: 13.0.0
      reason: 'Integrator-only. Sets the `maxSourceLength` render limit (R-SEC-5); an explicit `limits.maxSourceLength` wins. Over the limit, render() rejects with a `LIMIT` error instead of drawing a placeholder.'
  maxEdges:
    description: |
      Defines the maximum number of edges that can be drawn in a graph.
    type: integer
    default: 5000
    minimum: 0
    x-mermaid:
      status: honoured
      since: 13.0.0
      reason: 'The default changes from 500 to 5,000 (D31): one `A & … --> B & …` line multiplies edges, and v13 draws 5,000 quickly. Integrator-only; it sets the `maxEdges` render limit (R-SEC-5); an explicit `limits.maxEdges` wins. Over the limit, render() rejects with a `LIMIT` error.'
  ascii:
    description: |
      Text output (`format: 'ascii'`, DESIGN §6.3). Diagram text may set every key
      (front matter, directives). No defaults here, so SVG renders (and their default ids,
      which hash the resolved config) are unchanged; the text backend applies `unicode` and
      `compact` when a key is unset.
    type: object
    additionalProperties: false
    properties:
      charset:
        description: |
          Glyph set: `unicode` box drawing (the default) or pure `ascii` (D79, R-ASCII-6).
        type: string
        enum:
          - unicode
          - ascii
        x-mermaid:
          status: honoured
          since: 13.0.0
      padding:
        description: |
          Cell padding preset: `compact` (the default; box padding 1 across, 0 down; gaps 2 and 4) or
          `roomy` (mermaid-ascii-like: padding 1 each way, gaps of 5) (D77).
        type: string
        enum:
          - compact
          - roomy
        x-mermaid:
          status: honoured
          since: 13.0.0
      maxWidth:
        description: |
          Columns the drawing should fit. It becomes the layout's `availableWidth` in cells
          (tighten, then turn LR into TB). Output is never cropped; an `ASCII_TOO_WIDE`
          warning says when it still does not fit (D84, R-ASCII-8).
        type: integer
        minimum: 1
        x-mermaid:
          status: honoured
          since: 13.0.0
    x-mermaid:
      status: honoured
      since: 13.0.0
  darkMode:
    type: boolean
    default: false
    x-mermaid: { status: pending }
  htmlLabels:
    description: |
      Flag for setting whether or not a html tag should be used for rendering labels on nodes and edges.
      **Note:** Diagram-specific `htmlLabels` settings (e.g., `flowchart.htmlLabels`) are deprecated.
      Use this root-level `htmlLabels` setting instead. The root-level `htmlLabels` takes precedence
      over any diagram-specific settings.
    type: boolean
    x-mermaid:
      status: removed
      since: 13.0.0
      reason: Labels are SVG text only; there is no HTML label mode (D5).
      replacement: none; labels support a markdown subset rendered as SVG text
  fontFamily:
