  ArchitectureDiagramConfig:
    title: Architecture Diagram Config
    allOf: [{ $ref: '#/$defs/BaseDiagramConfig' }]
    description: The object containing configurations specific for architecture diagrams
    type: object
    unevaluatedProperties: false
    required:
      - useMaxWidth
      - padding
      - iconSize
      - fontSize
      - randomize
      - nodeSeparation
      - idealEdgeLengthMultiplier
      - edgeElasticity
      - numIter
      - seed
    properties:
      padding:
        type: number
        default: 40
        x-mermaid: { status: pending }
      iconSize:
        type: number
        default: 80
        x-mermaid: { status: pending }
      fontSize:
        type: number
        default: 16
        x-mermaid: { status: pending }
      randomize:
        description: |
          Whether to randomize initial node positions before running the layout algorithm.
          When false (default), nodes start at deterministic seed positions. When true, nodes
          start at random positions, which may produce varied but potentially better-spaced
          layouts. Note: `randomize: false` alone does NOT guarantee identical renders, because
          the underlying fcose layout still uses `Math.random()` internally during its
          constraint solver — use the `seed` option for full determinism.
        type: boolean
        default: false
        x-mermaid: { status: pending }
      nodeSeparation:
        description: |
          Minimum separation (in pixels) between sibling nodes in the same group, passed through to the
          underlying fcose layout. Increase to spread overlapping siblings apart when many edges share the
          same port direction.
        type: number
        default: 75
        x-mermaid: { status: pending }
      idealEdgeLengthMultiplier:
        description: |
          Multiplier applied to `iconSize` to compute the ideal length of edges between nodes within the
          same group. Increase to add breathing room; decrease to pack the diagram tighter. Edges crossing
          group boundaries are unaffected and use a fixed shorter length.
        type: number
        default: 1.5
        x-mermaid: { status: pending }
      edgeElasticity:
        description: |
          Spring elasticity (0–1) applied to edges between nodes within the same group, passed through to
          fcose. Higher values pull connected nodes closer together; lower values let the layout spread them
          out. Edges crossing group boundaries are unaffected.
        type: number
        default: 0.45
        x-mermaid: { status: pending }
      numIter:
        description: |
          Maximum number of iterations the fcose layout algorithm runs before stopping. Increase for higher
          quality on large or densely-connected diagrams at the cost of render time.
        type: number
        default: 2500
        x-mermaid: { status: pending }
      seed:
        description: |
          Deterministic seed for the fcose layout. Defaults to 1, which makes every render of the
          same diagram produce the same layout — required for visual regression tests to be stable.
          Set to 0 to opt out and use the unstubbed Math.random (the layout will still differ
          slightly between renders, matching pre-fix behavior). Any other number selects a
          different reproducible layout variant.
        type: number
        default: 1
        x-mermaid: { status: pending }

  MindmapDiagramConfig:
    title: Mindmap Diagram Config
    allOf: [{ $ref: '#/$defs/BaseDiagramConfig' }]
    description: The object containing configurations specific for mindmap diagrams
    type: object
    unevaluatedProperties: false
    required:
      - useMaxWidth
      - colorBy
      - padding
      - maxNodeWidth
      - layoutAlgorithm
    properties:
      theme:
        $ref: '#/$defs/BaseDiagramConfig/properties/theme'
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            Set here, it wins over the top-level `theme` for mindmaps (a diagram section beats
            the top level within a config layer).
      useWidth:
        $ref: '#/$defs/BaseDiagramConfig/properties/useWidth'
        x-mermaid:
          status: ignored
          since: 13.0.0
          reason: Only v12's gantt renderer read `useWidth`; the mindmap renderer never did.
      layout:
        $ref: '#/$defs/BaseDiagramConfig/properties/layout'
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            Set here, it wins over the top-level `layout` for mindmaps. Unset in both, mindmaps lay
            out with `tree`, core's two-sided tidy tree (D284). v12's `cose-bilkent` and `tidy-tree`
            map to `tree` silently (D282); `layered`, `dagre` and an installed `elk.*` are honoured;
            an unknown or uninstalled name draws with `tree` and warns `LAYOUT_UNKNOWN` or
            `ELK_NOT_INSTALLED`.
      useMaxWidth:
        $ref: '#/$defs/BaseDiagramConfig/properties/useMaxWidth'
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: As v12's `setupViewPortForSVG`, `width="100%"` and a `max-width` when true.
      colorBy:
        description: |
          Color nodes by their top-level branch or by their depth in the tree.
          Depth is counted from the root, independently of indentation width.
        type: string
        enum: ['branch', 'depth']
        meta:enum:
          branch: Descendants inherit the color of their top-level branch.
          depth: Nodes at the same distance from the root share a color across branches.
        default: 'branch'
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            As v12: eleven sections, by top-level branch or by depth below the root; any other
            value colours by branch.
      padding:
        description: |
          Padding in px inside default, cloud and bang nodes (and, in the classic themes,
          circles, and twice this inside hexagons), and the margin around the drawing.
        type: number
        default: 10
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            Where v12 read it (D287): the margin around the drawing, and the padding inside
            default, cloud and bang nodes in every theme. In the classic themes it also pads
            circles, and twice it pads hexagons; in the redux family, `neo` and `neo-dark` the
            theme's `circlePadding` and `hexagonPaddingX` / `hexagonPaddingY` take over there.
            Square and rounded nodes keep their own paddings. Numeric strings are read as numbers;
            anything else, or a value below 0, lays out with 10 and warns
            `MINDMAP_CONFIG_IGNORED`.
      maxNodeWidth:
        description: |
          The width in px at which node labels wrap.
        type: number
        default: 200
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            Labels wrap at it in every shape (D287); v12 wrapped square, rounded and hexagon
            nodes at `flowchart.wrappingWidth` instead (both 200 by default). Numeric strings are
            read as numbers; anything else, or a value of 0 or less, lays out with 200 and warns
            `MINDMAP_CONFIG_IGNORED`.
      layoutAlgorithm:
        description: Layout algorithm to use for positioning mindmap nodes
        type: string
        default: 'cose-bilkent'
        x-mermaid:
          status: ignored
          since: 13.0.0
          reason: >-
            v12 never read it. Mindmap lays out with core's `tree` engine (D284); `mindmap.layout`
            or the top-level `layout` chooses another engine, and `cose-bilkent` and `tidy-tree`
            there map to `tree`.
          replacement: '`mindmap.layout` or `layout`'

