          diagrams have margins, expressed in pixels.
        type: integer
        default: 20
        minimum: 0
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: The margin around the drawing, in px (D116). Text output keeps its own.
      layoutDirection:
        description: Directional bias for layout of entities
        type: string
        enum: ['TB', 'BT', 'LR', 'RL']
        meta:enum:
          TB: Top-Bottom
          BT: Bottom-Top
          LR: Left-Right
          RL: Right to Left
        default: TB
        x-mermaid:
          status: ignored
          since: 13.0.0
          reason: >-
            mermaid 12.2.0 does not read it either; only the legacy ER renderer, no longer used,
            did. The diagram's `direction` statement sets the direction.
          replacement: '`direction TB|BT|LR|RL` in the diagram text'
      minEntityWidth:
        description: The minimum width of an entity box. Expressed in pixels.
        type: integer
        default: 100
        minimum: 0
        x-mermaid: { status: honoured, since: 13.0.0 }
      minEntityHeight:
        description: The minimum height of an entity box. Expressed in pixels.
        type: integer
        default: 75
        minimum: 0
        x-mermaid:
          status: ignored
          since: 13.0.0
          reason: >-
            mermaid 12.2.0 does not read it either; only the legacy ER renderer, no longer used,
            did. An entity is as tall as its rows.
      entityPadding:
        description: |
          The minimum internal padding between text in an entity box and the enclosing box borders.
