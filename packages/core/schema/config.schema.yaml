# Used for VS Code's YAML plugin to automatically error on invalid types
# yaml-language-server: $schema=https://json-schema.org/draft/2019-09/schema

# The MermaidConfig JSON Schema, moved here from v12's
# `packages/mermaid/src/schemas/config.schema.yaml`. It is the single source of truth
# for config (R-CONF-4, D60). `pnpm gen:config` generates from it:
#   - `packages/core/src/config/generated/config.type.ts`: the `MermaidConfig` types
#   - `packages/core/src/config/generated/defaults.ts`: top-level defaults
#   - `packages/core/src/config/generated/keys.ts`: the key tree resolveConfig checks against
#   - `packages/diagram-<type>/src/generated/config-defaults.ts`: each ported diagram's section
#   - `v13/docs/config-reference.md` and the config section of `v13/docs/MIGRATION.md`
# `pnpm check` fails when any of them is stale or a key lacks an annotation.
#
# Every key under any `properties:` carries an `x-mermaid` annotation:
#   status: honoured | ignored | pending | removed | moved
#     honoured  v13 implements it
#     ignored   accepted, has no effect in v13 (give `reason`)
#     pending   accepted, honoured once its diagram type or feature lands (R-CONF-5)
#     removed   warns and is dropped (give `reason` or `replacement`); left out of the types
#     moved     warns; lives in the package named by `movedTo`
#   since, movedTo, replacement, reason: optional strings
# A key reached through a YAML alias shares its anchor's annotation.
#
# Useful things to know when editing this file
# - Use the `|` character for multi-line strings
# - Use `meta:enum` to document enum values
# - Use `tsType` to override the TypeScript type (from json-schema-to-typescript)
$id: https://mermaid.js.org/schemas/config.schema.json
$schema: https://json-schema.org/draft/2019-09/schema
title: Mermaid Config
type: object
additionalProperties: false
required:
  - fontFamily
  - logLevel
  - securityLevel
  - startOnLoad
  - arrowMarkerAbsolute
  - flowchart
  - sequence
  - gantt
  - journey
  - class
  - state
  - er
  - pie
  - quadrantChart
  - xyChart
  - requirement
  - architecture
  - mindmap
  - kanban
  - gitGraph
  - c4
  - sankey
  - packet
  - block
  - treeView
  - look
  - eventmodeling
  - radar
  - usecase
  - venn
properties:
  theme:
    # The diagram sections' enum plus v13's `auto`, which is a whole-diagram choice only
    # (so v12's per-diagram `theme` types are unchanged).
    description: |
      Theme, the CSS style sheet.
      You may also use `themeCSS` to override this value.
    type: string
    enum:
      - default
      - base
      - dark
      - forest
      - neutral
      - neo
      - neo-dark
      - redux
      - redux-dark
      - redux-color
      - redux-dark-color
      - auto
      - 'null'
    meta:enum:
      'null': Can be set to disable any pre-defined mermaid theme
      auto: 'New in v13: the default theme, and `dark` under `prefers-color-scheme: dark` (R-THEME-8)'
    default: 'redux-color'
    x-mermaid:
      status: honoured
      since: 13.0.0
      reason: >-
        The default changes from `default` to `redux-color`, the theme v12's flowchart renders by
        default (D151, amending D55). 13.0 ships the redux family (`redux`, `redux-color`,
        `redux-dark`, `redux-dark-color`) as real themes, plus `default`, `dark`, `forest`,
        `neutral` and `base`. `neo` renders `redux-color`, `neo-dark` renders `redux-dark-color`
        and `null` renders `base`, each with a `THEME_UNAVAILABLE` warning.
  themeVariables:
    tsType: any
    x-mermaid:
      status: honoured
      since: 13.0.0
      reason: >-
        Exposed as `--mermaid-<name>` CSS variables (see theme-variables.md). Every difference
        between the redux and classic theme families is a theme variable (D152), listed here as
        redux / classic value: `borderColorArray` Tailwind-400 × 12 in `redux-color` and
        `redux-dark-color` / none; `bkgColorArray` Tailwind-50 × 12 in `redux-color`, empty in
        `redux-dark-color` / none; `arrowheadGap` 4 / 0; `arrowheadLength` 10.5 / 8;
        `arrowheadWidth` ≈12.8 / 8; `circleArrowheadSize` 14 / 11; `circleArrowheadGap` ≈3.15 /
        ≈1.1; `crossArrowheadSize` 10.4 / 9; `crossArrowheadGap` ≈2.96 / ≈2;
        `crossArrowheadStrokeWidth` 2 / 2; `nodePaddingX` (per side) 16 / 2 × padding;
        `nodePaddingY` (per side) 12 / padding; `stadiumPaddingX` (total) 40 / padding;
        `stadiumPaddingY` (total) 24 / padding; `hexagonPaddingX` 70 / padding;
        `hexagonPaddingY` 32 / padding; `hexagonSlant` 3.5 / 4; `doubleCircleGap` 12 / 5;
        `doubleCirclePadding` 16 / padding; `circlePadding` 16 / padding; `circleMinDiameter` 44 /
        none; `subroutinePaddingX` / `subroutinePaddingY` (totals) 28 / 12 and padding;
        `cylinderPaddingX` / `cylinderPaddingY` (totals) 24 and padding; `leanPaddingX` /
        `leanPaddingY` (totals) 2 × padding / padding and padding; `oddPaddingX` / `oddPaddingY`
        (totals) 42 / 24 and padding; `dropShadow` `drop-shadow(4px 4px 0 rgb(0 0 0 / 0.06))` (white instead of black
        on the dark redux themes) / `none`; `compositeTitleBackground` `#f9f9fb` (`#16141f` on the dark redux
        themes) / `mainBkg`; `altBackground` `#f9f9fb` (`#16141f`) / `#f0f0f0` (`#555555` in `dark`,
        `#f4f4f4` in `neutral`, `tertiaryColor` in `base`). "padding" is `flowchart.padding`. Plain `redux` and
        `redux-dark` carry no palette. Geometry variables are read as numbers at render time,
        because they feed layout, so overriding their CSS variables has no effect;
        `dropShadow` is a CSS value.
    # Named variables are documented here; any other name is still accepted (R-CONF-5).
    type: object
    additionalProperties: true
    properties:
      borderColorArray:
        description: |
          Per-subgraph border colours, used by slot (declaration order, cycling). A list of
          colours, or one comma-separated string. Empty or unset: no per-subgraph colour.
        type: [array, string]
        items:
          type: string
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            Tailwind-400 × 12 in `redux-color` and `redux-dark-color`; empty in every other
            theme (D151). Read as literal colours, not CSS variables. An unsafe colour drops
            the whole list with `THEME_VARIABLE_DROPPED`.
      bkgColorArray:
        description: |
          Per-subgraph fill colours, by the same slot as `borderColorArray`. A list of colours,
          or one comma-separated string. Empty: subgraphs are coloured on the border only.
        type: [array, string]
        items:
          type: string
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            Tailwind-50 × 12 in `redux-color`; empty in `redux-dark-color` and every other theme
            (D151). Read as literal colours, not CSS variables. An unsafe colour drops the whole
            list with `THEME_VARIABLE_DROPPED`.
      arrowheadGap:
        description: |
          Space in px between a point arrowhead's tip and the node outline.
        type: [number, string]
        x-mermaid: &arrowhead
          status: honoured
          since: 13.0.0
          reason: >-
            Arrowhead geometry (D152): a number or a px length, redux / classic value in the
            `themeVariables` notes. Read as a number at render time, so overriding its CSS
            variable has no effect.
      arrowheadLength:
        description: |
          Length in px of a point arrowhead, from tip to base.
        type: [number, string]
        x-mermaid: *arrowhead
      arrowheadWidth:
        description: |
          Width in px of a point arrowhead's base.
        type: [number, string]
        x-mermaid: *arrowhead
      circleArrowheadSize:
        description: |
          Diameter in px of a circle arrowhead.
        type: [number, string]
        x-mermaid: *arrowhead
      circleArrowheadGap:
        description: |
          Space in px between a circle arrowhead and the node outline.
        type: [number, string]
        x-mermaid: *arrowhead
      crossArrowheadSize:
        description: |
          Side in px of the square a cross arrowhead's arms span.
        type: [number, string]
        x-mermaid: *arrowhead
      crossArrowheadGap:
        description: |
          Space in px between a cross arrowhead and the node outline.
        type: [number, string]
        x-mermaid: *arrowhead
      crossArrowheadStrokeWidth:
        description: |
          Stroke width in px of a cross arrowhead's arms.
        type: [number, string]
        x-mermaid: *arrowhead
      nodePaddingX:
        description: |
          Room left and right of a node label, per side, for the rectangle and the shapes that share its padding. A px number, or a multiple of `flowchart.padding` written `padding` or `<n> * padding`.
        type: [number, string]
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            16 in the redux themes; `2 * padding` in the classic themes. Read as a number at render time (D152), so its CSS variable has no effect.
      nodePaddingY:
        description: |
          Room above and below a node label, per side. A px number, or a multiple of `flowchart.padding` written `padding` or `<n> * padding`.
        type: [number, string]
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            12 in the redux themes; `padding` in the classic themes. Read as a number at render time (D152), so its CSS variable has no effect.
      stadiumPaddingX:
        description: |
          Stadium padding added to the width, in total. A px number, or a multiple of `flowchart.padding` written `padding` or `<n> * padding`.
        type: [number, string]
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            40 in the redux themes; `padding` in the classic themes. Read as a number at render time (D152), so its CSS variable has no effect.
      stadiumPaddingY:
        description: |
          Stadium padding added to the height, in total. A px number, or a multiple of `flowchart.padding` written `padding` or `<n> * padding`.
        type: [number, string]
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            24 in the redux themes; `padding` in the classic themes. Read as a number at render time (D152), so its CSS variable has no effect.
      hexagonPaddingX:
        description: |
          Hexagon padding added to the width, in total. A px number, or a multiple of `flowchart.padding` written `padding` or `<n> * padding`.
        type: [number, string]
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            70 in the redux themes; `padding` in the classic themes. v12 adds it to the height; v13 corrects the axes (D151). Read as a number at render time (D152), so its CSS variable has no effect.
      hexagonPaddingY:
        description: |
          Hexagon padding added to the height, in total. A px number, or a multiple of `flowchart.padding` written `padding` or `<n> * padding`.
        type: [number, string]
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            32 in the redux themes; `padding` in the classic themes. v12 adds it to the width; v13 corrects the axes (D151). Read as a number at render time (D152), so its CSS variable has no effect.
      hexagonSlant:
        description: |
          Hexagon slant factor: each pointed end is the height divided by this.
        type: number
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            3.5 in the redux themes; 4 in the classic themes. Read as a number at render time (D152), so its CSS variable has no effect.
      doubleCircleGap:
        description: |
          Gap between the two rings of a double circle.
        type: number
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            12 in the redux themes; 5 in the classic themes. Read as a number at render time (D152), so its CSS variable has no effect.
      doubleCirclePadding:
        description: |
          Room between the label diagonal and the inner ring of a double circle, per side. A px number, or a multiple of `flowchart.padding` written `padding` or `<n> * padding`.
        type: [number, string]
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            16 in the redux themes; `padding` in the classic themes. Read as a number at render time (D152), so its CSS variable has no effect.
      circlePadding:
        description: |
          Added to the label's diagonal to give a circle's diameter. A px number, or a multiple of `flowchart.padding` written `padding` or `<n> * padding`.
        type: [number, string]
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            16 in the redux themes (v13's earlier value, kept, D151); `padding` in the classic themes. Read as a number at render time (D152), so its CSS variable has no effect.
      circleMinDiameter:
        description: |
          The smallest circle diameter.
        type: number
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            44 in the redux themes; 0 (none) in the classic themes. Read as a number at render time (D152), so its CSS variable has no effect.
      subroutinePaddingX:
        description: |
          Subroutine padding added to the width, in total, inside its two 8px frames. A px number, or a multiple of `flowchart.padding` written `padding` or `<n> * padding`.
        type: [number, string]
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            28 in the redux themes; `padding` in the classic themes (v12 `subroutine.ts`). Read as a number at render time (D152), so its CSS variable has no effect.
      subroutinePaddingY:
        description: |
          Subroutine padding added to the height, in total. A px number, or a multiple of `flowchart.padding` written `padding` or `<n> * padding`.
        type: [number, string]
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            12 in the redux themes; `padding` in the classic themes (v12 `subroutine.ts`). Read as a number at render time (D152), so its CSS variable has no effect.
      cylinderPaddingX:
        description: |
          Cylinder (database) padding added to the width, in total. A px number, or a multiple of `flowchart.padding` written `padding` or `<n> * padding`.
        type: [number, string]
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            24 in the redux themes; `padding` in the classic themes (v12 `cylinder.ts`). The lined cylinder uses it too. Read as a number at render time (D152), so its CSS variable has no effect.
      cylinderPaddingY:
        description: |
          Cylinder (database) padding added to the height, in total, besides the caps. A px number, or a multiple of `flowchart.padding` written `padding` or `<n> * padding`.
        type: [number, string]
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            24 in the redux themes; `padding` in the classic themes (v12 `cylinder.ts`). The lined cylinder uses it too. Read as a number at render time (D152), so its CSS variable has no effect.
      leanPaddingX:
        description: |
          Parallelogram and trapezoid padding added to the width, in total (on each side for the inverted trapezoid `[\text/]`, as v12). A px number, or a multiple of `flowchart.padding` written `padding` or `<n> * padding`.
        type: [number, string]
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            `2 * padding` in the redux themes; `padding` in the classic themes (v12 `leanRight.ts`, `trapezoid.ts`, `invertedTrapezoid.ts`). Read as a number at render time (D152), so its CSS variable has no effect.
      leanPaddingY:
        description: |
          Parallelogram and trapezoid padding added to the height, in total (on each side for the inverted trapezoid). A px number, or a multiple of `flowchart.padding` written `padding` or `<n> * padding`.
        type: [number, string]
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            `padding` in every theme, kept so the pair is complete (v12 `leanRight.ts`, `trapezoid.ts`, `invertedTrapezoid.ts`). Read as a number at render time (D152), so its CSS variable has no effect.
      oddPaddingX:
        description: |
          Asymmetric shape (`>text]`) padding added to the width, in total. A px number, or a multiple of `flowchart.padding` written `padding` or `<n> * padding`.
        type: [number, string]
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            42 (21 per side) in the redux themes; `padding` in the classic themes (v12 `rectLeftInvArrow.ts`). Read as a number at render time (D152), so its CSS variable has no effect.
      oddPaddingY:
        description: |
          Asymmetric shape padding added to the height, in total. A px number, or a multiple of `flowchart.padding` written `padding` or `<n> * padding`.
        type: [number, string]
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            24 (12 per side) in the redux themes; `padding` in the classic themes (v12 `rectLeftInvArrow.ts`). Read as a number at render time (D152), so its CSS variable has no effect.
      compositeTitleBackground:
        description: |
          Fill of a composite state's title strip (state diagram).
        type: string
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            v12's values (D120): `#f9f9fb` in `redux` and `redux-color`, `#16141f` in
            `redux-dark` and `redux-dark-color`; `mainBkg` in the classic themes.
      altBackground:
        description: |
          Fill of an alternate (nested) composite state's body and of a concurrency divider
          (state diagram).
        type: string
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            v12's values (D120): `#f9f9fb` in `redux` and `redux-color`, `#16141f` in
            `redux-dark` and `redux-dark-color`; `#f0f0f0` in `default` and `forest`, `#555555`
            in `dark`, `#f4f4f4` in `neutral`, `tertiaryColor` in `base`.
  themeCSS:
    type: string
    x-mermaid:
      status: ignored
      since: 13.0.0
      reason: v13 output carries no author stylesheet (R-SEC-2).
      replacement: '`themeVariables`, or `--mermaid-*` CSS variables set by the host page'
  look:
    $ref: '#/$defs/BaseDiagramConfig/properties/look'
    x-mermaid:
      status: ignored
      since: 13.0.0
      reason: >-
        `look` is removed (D153): the key is accepted and ignored, with one `LOOK_REMOVED`
        warning per render. The v12 neo and classic geometry is theme data instead: the redux
        themes carry neo geometry and the classic themes carry classic geometry (D152).
      replacement: '`theme`, or the geometry and `dropShadow` theme variables; `handDrawn` comes from the hand-drawn plugin (R-PLUG-8)'
  handDrawnSeed:
    description: |
      Defines the seed to be used when using handDrawn look. This is important for the automated tests as they will always find differences without the seed. The default value is 0 which gives a random seed.
    type: number
    default: 0
    x-mermaid: { status: pending }
  layout:
    $ref: '#/$defs/BaseDiagramConfig/properties/layout'
    description: |
      Defines which layout algorithm to use for rendering the diagram.

      Defaults to `layered`, the layout engine built into core (DESIGN §6.1).
      The v12 names `dagre` and `elk` are still accepted and map to `layered`
      until an ELK plugin is installed.
    default: 'layered'
    x-mermaid:
      status: honoured
      since: 13.0.0
      reason: 'The default changes from `elk` to `layered`, the built-in engine (DESIGN §6.1). The v12 values `dagre`, `elk` and `elk.<algorithm>` stay valid and map to `layered` until an ELK plugin exists (R-PLUG-8); other engines come in through `registerLayoutLoaders` (R-LAYOUT-2), and an unknown name falls back to `layered` with a `LAYOUT_UNKNOWN` warning.'
  maxTextSize:
    description: The maximum allowed size of the users text diagram
    type: number
    default: 50000
    x-mermaid:
      status: honoured
      since: 13.0.0
      reason: 'Integrator-only. Sets the `maxSourceLength` render limit (R-SEC-5); an explicit `limits.maxSourceLength` wins. Over the limit, render() rejects with a `LIMIT` error instead of drawing a placeholder.'
  maxEdges:
    description: |
      Defines the maximum number of edges that can be drawn in a graph.
    type: integer
    default: 5000
    minimum: 0
    x-mermaid:
      status: honoured
      since: 13.0.0
      reason: 'The default changes from 500 to 5,000 (D31): one `A & … --> B & …` line multiplies edges, and v13 draws 5,000 quickly. Integrator-only; it sets the `maxEdges` render limit (R-SEC-5); an explicit `limits.maxEdges` wins. Over the limit, render() rejects with a `LIMIT` error.'
  ascii:
    description: |
      Text output (`format: 'ascii'`, DESIGN §6.3). Diagram text may set every key
      (front matter, directives). No defaults here, so SVG renders (and their default ids,
      which hash the resolved config) are unchanged; the text backend applies `unicode` and
      `compact` when a key is unset.
    type: object
    additionalProperties: false
    properties:
      charset:
        description: |
          Glyph set: `unicode` box drawing (the default) or pure `ascii` (D79, R-ASCII-6).
        type: string
        enum:
          - unicode
          - ascii
        x-mermaid:
          status: honoured
          since: 13.0.0
      padding:
        description: |
          Cell padding preset: `compact` (the default; box padding 1 across, 0 down; gaps 2 and 4) or
          `roomy` (mermaid-ascii-like: padding 1 each way, gaps of 5) (D77).
        type: string
        enum:
          - compact
          - roomy
        x-mermaid:
          status: honoured
          since: 13.0.0
      maxWidth:
        description: |
          Columns the drawing should fit. It becomes the layout's `availableWidth` in cells
          (tighten, then turn LR into TB). Output is never cropped; an `ASCII_TOO_WIDE`
          warning says when it still does not fit (D84, R-ASCII-8).
        type: integer
        minimum: 1
        x-mermaid:
          status: honoured
          since: 13.0.0
    x-mermaid:
      status: honoured
      since: 13.0.0
  elk:
    type: object
    properties:
      mergeEdges:
        description: |
          Elk specific option that allows edges to share path where it convenient. It can make for pretty diagrams but can also make it harder to read the diagram.
        type: boolean
        default: false
        x-mermaid: { status: pending }
      nodePlacementStrategy:
        description: |
          Elk specific option affecting how nodes are placed.
        type: string
        enum:
          - SIMPLE
          - NETWORK_SIMPLEX
          - LINEAR_SEGMENTS
          - BRANDES_KOEPF
        x-mermaid: { status: pending }
        # Default comes from `elk.preset` unless set explicitly.
      nodePlacementAlignment:
        description: |
          Elk specific option affecting Brandes-Koepf node placement alignment.
          BALANCED combines the four directional alignments; NONE picks the
          smallest result. Defaults to BALANCED for the default preset and NONE
          for named non-default presets.
        type: string
        enum:
          - NONE
          - LEFTUP
          - LEFTDOWN
          - RIGHTUP
          - RIGHTDOWN
          - BALANCED
        x-mermaid: { status: pending }
        # Default comes from `elk.preset` unless set explicitly.
      preset:
        description: |
          Named combination of layering, node placement, placement alignment
          and cycle breaking options. Explicit options override the preset for
          that option; the remaining preset values still apply.

          `default` — network simplex layering, balanced Brandes-Koepf placement
          at the top level and inside subgraphs, and depth-first cycle breaking.
          Balanced placement favors centered branches and composite-state entries,
          sometimes at the cost of a wider or taller drawing. It does not
          guarantee that every edge attaches to the center of its target.

          `legacy` — Brandes-Koepf placement with NONE alignment and ELK's own
          greedy cycle breaking. Reproduces the rendering before presets existed.

          `modelOrder` — network simplex layering and top-level placement,
          Brandes-Koepf placement inside subgraphs, NONE alignment, and greedy
          model-order cycle breaking, which favors declaration order.

          `depthFirst` — the previous default: network simplex layering and
          top-level placement, Brandes-Koepf placement inside subgraphs, NONE
          alignment, and depth-first cycle breaking.

          Setting `layeringStrategy`, `nodePlacementStrategy`,
          `nodePlacementAlignment` or `cycleBreakingStrategy` explicitly overrides
          the preset for that option, including an explicit NONE alignment.
        type: string
        enum:
          - default
          - legacy
          - modelOrder
          - depthFirst
        default: default
        x-mermaid: { status: pending }
      straightenEdges:
        description: |
          Straightens an edge that leaves or enters a node with a tiny step.

          ELK spreads an edge's port evenly along a node's side but routes the
          edge down a channel whose row rarely lines up with that port exactly,
          leaving a staircase of a few pixels right at the border. With rounded
          corners the two micro-bends land on top of each other and read as a
          kink. Enabling this moves the channel onto the port's row and drops
          the step, so the edge draws as one straight line and both ports stay
          exactly where the layout put them.

          Only the step next to a node is touched, and only when the edge
          continues the same way afterwards, so a real turn is never collapsed.
          An edge is left alone entirely when moving its run would drag the far
          port, or would introduce a crossing.
        type: boolean
        default: true
        x-mermaid: { status: pending }
      lineHops:
        description: |
          Renders edge crossings as small arcs ("hops") or visible gaps, so that
          it is clear which line passes over which where two edges meet.

          The edge that gives way loses its corner rounding for the segment
          carrying the hop, which is the trade for a readable crossing. Curved
          edges are skipped rather than rewritten, to avoid corrupting their
          geometry. Set to `false` to draw plain crossings.
        oneOf:
          - type: boolean
          - type: string
            enum: ['arc', 'gap']
        default: true
        x-mermaid: { status: pending }
      layeringStrategy:
        description: |
          Elk specific option deciding which layer each node is assigned to — the
          column in a left-to-right diagram, the row in a top-down one. This is
          the coarsest of the three placement decisions, so changing it moves
          nodes further than anything else short of altering spacing.

          NETWORK_SIMPLEX aims for the fewest long edges. LONGEST_PATH pushes
          every node as late as it can go. COFFMAN_GRAHAM bounds how many nodes
          share a layer, giving a more even, block-like shape on wide graphs.
          MIN_WIDTH and STRETCH_WIDTH trade edge length for a narrower or wider
          drawing. INTERACTIVE honours positions already on the nodes.
        type: string
        enum:
          - NETWORK_SIMPLEX
          - LONGEST_PATH
          - LONGEST_PATH_SOURCE
          - COFFMAN_GRAHAM
          - MIN_WIDTH
          - STRETCH_WIDTH
          - INTERACTIVE
        x-mermaid: { status: pending }
        # Default comes from `elk.preset` unless set explicitly.
      layeringLayerBound:
        description: |
          Elk specific option capping how many nodes COFFMAN_GRAHAM will put in
          one layer. Ignored by every other layering strategy. Lower values give
          a taller, narrower drawing.
        type: number
        default: 4
        x-mermaid: { status: pending }
      cycleBreakingStrategy:
        description: |
          This strategy decides how to find cycles in the graph and deciding which edges need adjustment to break loops.
        type: string
        enum:
          - GREEDY
          - DEPTH_FIRST
          - INTERACTIVE
          - MODEL_ORDER
          - GREEDY_MODEL_ORDER
        x-mermaid: { status: pending }
        # Default comes from `elk.preset` unless set explicitly.
      forceNodeModelOrder:
        description: |
          The node order given by the model does not change to produce a better layout. E.g. if node A is before node B in the model this is not changed during crossing minimization. This assumes that the node model order is already respected before crossing minimization. This can be achieved by setting considerModelOrder.strategy to NODES_AND_EDGES.
        type: boolean
        default: false
        x-mermaid: { status: pending }
      considerModelOrder:
        description: |
          Preserves the order of nodes and edges in the model file if this does not lead to additional edge crossings. Depending on the strategy this is not always possible since the node and edge order might be conflicting.
        type: string
        enum:
          - NONE
          - NODES_AND_EDGES
          - PREFER_EDGES
          - PREFER_NODES
        default: 'NODES_AND_EDGES'
        x-mermaid: { status: pending }
      keepEntryNodeOnTop:
        description: |
          Elk specific option that keeps the entry node of a recursive flow at the top of the layout.

          When a flow loops back on itself (a back-edge to an earlier node), ELK's degree-based cycle-breaking has no notion of an "entry point" and may rank the first-declared node in the middle, scrambling the reading order. When enabled, the entry node of each cyclic component is pinned to the first layer so the diagram still reads from its entry. Acyclic flows always have a natural source, so this has no effect on them.

          Only applies when the cyclic flow has no node without incoming edges: if the loop is fed from outside (e.g. a start node pointing into it), that component already has a natural source and nothing is pinned. Detection is also scoped per container, so cycles that cross a subgraph boundary are not detected.
        type: boolean
        default: false
        x-mermaid: { status: pending }
      orientFeedbackEdges:
        description: |
          Routes an edge that re-enters a subgraph downstream instead of around the subgraph.

          ELK lays out a subgraph as one node of its parent graph. A node outside a subgraph that both receives an edge from it and sends one back into it therefore closes a cycle there, even when the nodes inside do not. ELK breaks that cycle by reversing one of the edges and routes it into the subgraph's input side, around the outside of the subgraph.

          When enabled, such edges are found before layout, on the graph with each subgraph collapsed, and handed to ELK in the other direction. The edge is drawn with its arrowhead at its real target. Cycles between plain nodes are left to `cycleBreakingStrategy`.
        type: boolean
        default: true
        x-mermaid: { status: pending }
    x-mermaid:
      status: pending
      reason: ELK layout moves to an optional plugin package (R-PLUG-8).
  darkMode:
    type: boolean
    default: false
    x-mermaid: { status: pending }
  htmlLabels:
    description: |
      Flag for setting whether or not a html tag should be used for rendering labels on nodes and edges.
      **Note:** Diagram-specific `htmlLabels` settings (e.g., `flowchart.htmlLabels`) are deprecated.
      Use this root-level `htmlLabels` setting instead. The root-level `htmlLabels` takes precedence
      over any diagram-specific settings.
    type: boolean
    x-mermaid:
      status: removed
      since: 13.0.0
      reason: Labels are SVG text only; there is no HTML label mode (D5).
      replacement: none; labels support a markdown subset rendered as SVG text
  fontFamily:
    description: |
      Specifies the font to be used in the rendered diagrams.
      Can be any possible CSS `font-family`.
      See https://developer.mozilla.org/en-US/docs/Web/CSS/font-family
    type: string
    default: '"trebuchet ms", verdana, arial, sans-serif;'
    x-mermaid:
      status: honoured
      since: 13.0.0
      reason: 'As in v12, a `fontFamily` set by `initialize()` or diagram text also sets `themeVariables.fontFamily`, which drawing and measuring use.'
  altFontFamily:
    # TODO: seems to be unused, except for in tests
    type: string
    x-mermaid:
      status: ignored
      since: 13.0.0
      reason: Unused by every renderer, also in v12.
  logLevel:
    description: |
      This option decides the amount of logging to be used by mermaid.
    type:
      - string
      - number
    enum:
      - trace
      - 0
      - debug
      - 1
      - info
      - 2
      - warn
      - 3
      - error
      - 4
      - fatal
      - 5
    meta:enum:
      trace: Equivalent to 0
      debug: Equivalent to 1
      info: Equivalent to 2
      warn: Equivalent to 3
      error: Equivalent to 4
      fatal: Equivalent to 5 (default)
    default: 5
    x-mermaid:
      status: ignored
      since: 13.0.0
      reason: v13 does not log; problems are returned in `RenderResult.warnings`.
  securityLevel:
    description: |
      Level of trust for parsed diagram. `default` allows `http`, `https`, `mailto` and
      relative link URLs; `strict` allows relative links only (R-SEC-4, R-SEC-6).
    type: string
    enum:
      - default
      - strict
      - loose
      - antiscript
      - sandbox
    meta:enum:
      default: (**default**) Link URLs may use `http`, `https`, `mailto` or be relative.
      strict: Only relative link URLs are kept; absolute links are dropped with a warning.
      antiscript: No longer supported; treated as `default`, with a warning.
      loose: No longer supported; treated as `default`, with a warning.
      sandbox: No longer supported; treated as `default`, with a warning.
    default: default
    x-mermaid:
      status: honoured
      since: 13.0.0
      reason: "The default changes from `strict` to the new level `default` (D48, D75), which keeps v12's absolute `http`/`https`/`mailto` links; `strict` now keeps relative links only, so an integrator who set `strict` explicitly loses absolute links (set `default` to keep them). `loose`, `antiscript` and `sandbox` act as `default` with a warning."
  startOnLoad:
    description: Dictates whether mermaid starts on Page load
    type: boolean
    default: true
    x-mermaid:
      status: honoured
      since: 13.0.0
      reason: As in v12, the browser build runs `run()` on `window` load unless `initialize()` turns this off.
  arrowMarkerAbsolute:
    # YAML anchor, can be used later with `*arrowMarkerAbsolute`
    &arrowMarkerAbsolute
    description: |
      Controls whether or arrow markers in html code are absolute paths or anchors.
      This matters if you are using base tag settings.
    type: boolean
    default: false
    x-mermaid:
      status: ignored
      since: 13.0.0
      reason: Arrowheads are inline paths, not `<marker>` references.
  secure:
    description: |
      This option controls which `currentConfig` keys are considered secure and
      can only be changed via call to `mermaid.initialize`.
      This prevents malicious graph directives from overriding a site's default security.
    default:
      [
        'secure',
        'securityLevel',
        'startOnLoad',
        'maxTextSize',
        'suppressErrorRendering',
        'maxEdges',
      ]
    type: array
    items:
      type: string
    uniqueItems: false # Should be enabled, but it may be a breaking change from the old config
    x-mermaid:
      status: honoured
      since: 13.0.0
  legacyMathML:
    description: |
      This option specifies if Mermaid can expect the dependent to include KaTeX stylesheets for browsers
      without their own MathML implementation. If this option is disabled and MathML is not supported, the math
      equations are replaced with a warning. If this option is enabled and MathML is not supported, Mermaid will
      fall back to legacy rendering for KaTeX.
    type: boolean
    default: false
    x-mermaid: { status: pending }
  forceLegacyMathML:
    description: |
      This option forces Mermaid to rely on KaTeX's own stylesheet for rendering MathML. Due to differences between OS
      fonts and browser's MathML implementation, this option is recommended if consistent rendering is important.
      If set to true, ignores legacyMathML.
    type: boolean
    default: false
    x-mermaid: { status: pending }
  deterministicIds:
    description: |
      This option controls if the generated ids of nodes in the SVG are
      generated randomly or based on a seed.
      If set to `false`, the IDs are generated based on the current date and
      thus are not deterministic. This is the default behavior.

      This matters if your files are checked into source control e.g. git and
      should not change unless content is changed.
    type: boolean
    default: false
    x-mermaid:
      status: honoured
      since: 13.0.0
      reason: v13 output ids never depend on the clock. With this set, each `run()` numbers its diagrams `mermaid-<n>` from the length of `deterministicIDSeed`, as v12 did; otherwise the count continues across calls.
  deterministicIDSeed:
    description: |
      This option is the optional seed for deterministic ids.
      If set to `undefined` but deterministicIds is `true`, a simple number iterator is used.
      You can set this attribute to base the seed on a static string.
    type: string
    x-mermaid:
      status: honoured
      since: 13.0.0
      reason: As in v12, only its length is used, as the first `run()` diagram number when `deterministicIds` is set.
