          Flag for setting whether or not a html tag should be used for rendering labels on nodes and edges.
          This property is deprecated.
          Please use the global `htmlLabels` configuration instead.
        type:
          - boolean
          - 'null'
        deprecated: true
        default: null
        x-mermaid:
          status: removed
          since: 13.0.0
          reason: Labels are SVG text only; there is no HTML label mode (D5).
          replacement: none; labels support a markdown subset rendered as SVG text
      nodeSpacing:
        description: |
          Defines the spacing between nodes on the same level

          Pertains to horizontal spacing for TB (top to bottom) or BT (bottom to top) graphs,
          and the vertical spacing for LR as well as RL graphs.
        type: integer
        default: 50
        minimum: 0
        x-mermaid: { status: honoured, since: 13.0.0 }
      rankSpacing:
        description: |
          Defines the spacing between nodes on different levels

          Pertains to horizontal spacing for TB (top to bottom) or BT (bottom to top) graphs,
          and the vertical spacing for LR as well as RL graphs.
        type: integer
        default: 50
        minimum: 0
        x-mermaid: { status: honoured, since: 13.0.0 }
      curve:
        description: |
          Defines how mermaid renders curves for flowcharts.
        type: string
        enum:
          [
            'basis',
            'bumpX',
            'bumpY',
            'cardinal',
            'catmullRom',
            'linear',
            'monotoneX',
            'monotoneY',
            'natural',
            'step',
            'stepAfter',
            'stepBefore',
            'rounded',
          ]
        default: 'rounded'
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            The default changes from `basis` to `rounded`, the look of v12's default ELK layout:
            stepped routes whose corners are arcs of radius 5 (less on a short leg). Set `basis`
            to keep S-curves. `linear` draws straight segments; `step`, `stepBefore` and `stepAfter` draw stepped
            routes; `rounded` draws straight segments with rounded corners; every other value draws
            S-curves (the layout engine routes edges, not a d3 curve factory).

      padding:
        description: |
          Represents the padding between the labels and the shape

          **Only used in new experimental rendering.**
        type: number
        default: 15
        x-mermaid:
          status: honoured
          since: 13.0.0
          reason: >-
            The "padding" of the classic themes' node, stadium, hexagon, double-circle and
            circle padding variables (D151, D152), and of the diamond in every theme (side =
            label width + label height + 2 × padding). The redux themes use their own fixed
            padding variables (see `themeVariables`); a padding variable set to `padding` or
            `<n> * padding` follows this value in any theme.
      wrappingWidth:
        description: |
          Width of nodes where text is wrapped.

          When using markdown strings the text is wrapped automatically, this
          value sets the max width of a text before it continues on a new line.
        type: number
        default: 120
        x-mermaid: { status: honoured, since: 13.0.0 }
      minNodeWidth:
        description: |
          Minimum width of the label area of a node.

          Labels narrower than this are widened to it, so nodes with short text
          get a uniform width; the node's own padding is added on top, the same
          way it is for `wrappingWidth`. Nodes with an explicit width are not
          affected.
        type: number
        default: 120
        x-mermaid: { status: honoured, since: 13.0.0 }

      stepDuration:
        description: |
