# How this package plugs into the shared workspace tools (tools/workspace/diagrams.ts). Not published.
# configDefaults: tools/gen-config writes src/generated/config-defaults.ts for the config section.
configDefaults: true

# grammars: tools/gen-grammar's targets, one per grammar file (`grammar/<grammar>.ebnf`): the
# type names the generated tables, `title` the syntax page, `kinds` the token kinds (D94).
grammars:
  - type: kanban
    title: Kanban syntax
    kinds:
      module: parser/tokens.ts
      object: T
      unnamed:
        # Text jison matches without returning a token; the hand-written lexer keeps one for it.
        ClassStart:
          mode: INITIAL
          pattern: ':::'
          docOf: CLASS
        ClassEnd:
          mode: class
          pattern: \n
        IconStart:
          mode: INITIAL
          pattern: '::icon\('
          docOf: ICON
        IconEnd:
          mode: icon
          pattern: \)
        MdStringStart:
          mode: node
          pattern: '["][`]'
        MdStringEnd:
          mode: nstr2
          pattern: '[`]["]'
        StringStart:
          mode: node
          pattern: '["]'
        StringEnd:
          mode: nstr
          pattern: '["]'
        ShapeDataEnd:
          mode: shapeData
          pattern: \}
        # One `SHAPE_DATA` rule each: the lexer keeps a kind per rule.
        ShapeDataStart:
          mode: INITIAL
          pattern: '@\{'
          terminal: SHAPE_DATA
        ShapeDataQuote:
          mode: shapeData
          pattern: '"'
          terminal: SHAPE_DATA
        ShapeDataStr:
          mode: shapeDataStr
          pattern: '[^"]+'
          terminal: SHAPE_DATA
      # A `%%` comment v12 left and a blank run are both SPACELINE; `@{` and the text between
      # quotes are Meta, the quoted values String.
      mixed:
        - SPACELINE
        - SHAPE_DATA

# languageBundle: what this package's ./language bundle must not reach (R-LANG-8, bench).
languageBundle:
  renderer:
    - render/
    - layout/
    - theme/
    - plugin.ts
    - index.ts
    - testing.ts

# release: the package's row in v13/docs/RELEASING.md (`pnpm regen`).
release:
  summary: 'The kanban board plugin (SVG; `kanban`).'
  install: 'with `mermaid/slim`'

# theme: what the theme specs need from this package (tools/gen-config/src/theme-packages.ts):
# dynamicReads: names the sources build at run time, which the usedBy scan for literals
# can't see; someThemes / authorOnly: table rows that may resolve to `currentColor` (#374).
theme:
  # `paints` in render/paint.ts reads the column colours `columnVar(n)`, `kanbanColumn${n}`.
  dynamicReads:
    [
      'kanbanColumn0',
      'kanbanColumn1',
      'kanbanColumn2',
      'kanbanColumn3',
      'kanbanColumn4',
      'kanbanColumn5',
      'kanbanColumn6',
      'kanbanColumn7',
      'kanbanColumn8',
      'kanbanColumn9',
      'kanbanColumn10',
      'kanbanColumn11',
    ]
