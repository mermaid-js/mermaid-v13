# How this package plugs into the shared workspace tools (tools/workspace/diagrams.ts). Not published.
# configDefaults: tools/gen-config writes src/generated/config-defaults.ts for the config section.
configDefaults: true

# grammars: tools/gen-grammar's targets, one per grammar file (`grammar/<grammar>.ebnf`): the
# type names the generated tables, `title` the syntax page, `kinds` the token kinds (D94).
grammars:
  - type: treemap
    title: Treemap syntax
    kinds:
      module: parser/tokens.ts
      object: T

# languageBundle: what this package's ./language bundle must not reach (R-LANG-8, bench).
languageBundle:
  renderer:
    - render/
    - layout/
    - theme/
    - plugin.ts
    - index.ts
    - config.ts
    - testing.ts
    - test-context.ts

# release: the package's row in v13/docs/RELEASING.md (`pnpm regen`).
release:
  summary: 'The treemap plugin (SVG; `treemap`, `treemap-beta`).'
  install: 'with `mermaid/slim`'

# credits: licence credits for pnpm check:licenses (tools/release/src/licenses.ts, R-REL-4):
# the upstreams this package's ported files derive from, and the files that must credit them.
# mermaid's notices carry them too (its CDN build bundles this package): notices/mermaid.txt.
credits:
  upstreams:
    - name: 'd3-hierarchy'
      marker: 'https://github.com/d3/d3-hierarchy'
      holder: ['Mike Bostock']
      copyright: ['Copyright 2010-2021 Mike Bostock']
      license: ISC
    - name: 'd3-format'
      marker: 'https://github.com/d3/d3-format'
      holder: ['Mike Bostock']
      copyright: ['Copyright 2010-2026 Mike Bostock']
      license: ISC
  files:
    src/layout/tiles.ts: ['d3-hierarchy']
    src/format/d3-format.ts: ['d3-format']

# theme: what the theme specs need from this package (tools/gen-config/src/theme-packages.ts):
# dynamicReads: names the sources build at run time, which the usedBy scan for literals
# can't see; someThemes / authorOnly: table rows that may resolve to `currentColor` (#374).
theme:
  # `paints` in render/paint.ts reads the section strokes `cScalePeer${slot - 1}`.
  dynamicReads:
    [
      'cScalePeer0',
      'cScalePeer1',
      'cScalePeer2',
      'cScalePeer3',
      'cScalePeer4',
      'cScalePeer5',
      'cScalePeer6',
      'cScalePeer7',
      'cScalePeer8',
      'cScalePeer9',
      'cScalePeer10',
      'cScalePeer11',
    ]
