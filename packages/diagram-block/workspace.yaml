# How this package plugs into the shared workspace tools (tools/workspace/diagrams.ts). Not published.
# configDefaults: tools/gen-config writes src/generated/config-defaults.ts for the config section.
configDefaults: true

# grammars: tools/gen-grammar's targets, one per grammar file (`grammar/<grammar>.ebnf`): the
# type names the generated tables, `title` the syntax page, `kinds` the token kinds (D94).
grammars:
  - type: block
    title: Block diagram syntax
    kinds:
      module: parser/tokens.ts
      object: T
      unnamed:
        # `block` and `block-beta` are both jison's `BLOCK_DIAGRAM_KEY`.
        Block:
          mode: INITIAL
          pattern: block\b
          terminal: BLOCK_DIAGRAM_KEY
          docOf: BLOCK_DIAGRAM_KEY
        # Text jison matches without returning a token; the hand-written lexer keeps one for it.
        StringStart:
          mode: INITIAL
          pattern: '["]'
        StringEnd:
          mode: string
          pattern: '["]'
        MdStringStart:
          mode: INITIAL
          pattern: '["][`]'
        MdStringEnd:
          mode: md_string
          pattern: '[`]["]'
        ArrowDirStart:
          mode: BLOCK_ARROW
          pattern: '\]>\s*\('
        AccDescrMultiline:
          mode: INITIAL
          pattern: 'accDescr\s*\{\s*'
          docOf: acc_descr
        AccDescrMultilineEnd:
          mode: acc_descr_multiline
          pattern: '[\}]'
          docOf: acc_descr

# languageBundle: what this package's ./language bundle must not reach (R-LANG-8, bench).
languageBundle:
  renderer:
    - render/
    - layout/
    - shapes/
    - plugin.ts
    - index.ts
    - testing.ts
    - test-context.ts
    - ascii/
    - ascii.ts

# theme: what the theme specs need from this package (tools/gen-config/src/theme-packages.ts):
# dynamicReads: names the usedBy scan for literals can't see.
theme:
  # `themePads` (`@mermaid-js/shared/shapes`, called in layout/layout.ts) reads the shapes'
  # padding and sizes for this package: the scan does not follow this subpath (one read set per shape).
  dynamicReads:
    [
      'nodePaddingX',
      'nodePaddingY',
      'stadiumPaddingX',
      'stadiumPaddingY',
      'hexagonPaddingX',
      'hexagonPaddingY',
      'hexagonSlant',
      'subroutinePaddingX',
      'subroutinePaddingY',
      'cylinderPaddingX',
      'cylinderPaddingY',
      'leanPaddingX',
      'leanPaddingY',
      'oddPaddingX',
      'oddPaddingY',
      'doubleCircleGap',
      'doubleCirclePadding',
      'circlePadding',
      'circleMinDiameter',
    ]

# release: the package's row in v13/docs/RELEASING.md (`pnpm regen`).
release:
  summary: 'The block diagram plugin (SVG, and text output from `/ascii`; `block`, `block-beta`).'
  install: 'with `mermaid/slim`'
