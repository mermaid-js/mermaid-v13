# How this package plugs into the shared workspace tools (tools/workspace/diagrams.ts). Not published.
# Pre-manifest until #550 (T5) adds the `mermaid` manifest: configDefaults, release and
# languageBundle come then (v13/docs/agents/port-diagram/shared-files.md, "Before T5").

# grammars: tools/gen-grammar's targets, one per grammar file (`grammar/<grammar>.ebnf`): the
# type names the generated tables, `title` the syntax page, `kinds` the token kinds (D94).
grammars:
  - type: agentflow
    title: Agentflow syntax
    kinds:
      module: parser/tokens.ts
      object: T
      # As flowchart's (D467): text jison matches without returning a token.
      unnamed:
        ShapeDataEnd:
          mode: shapeData
          pattern: \}
        ClickKeyword:
          mode: INITIAL
          pattern: 'click\s+'
          docOf: CLICK
      mixed:
        - SHAPE_DATA
      documented:
        - Click
        - CallbackName
