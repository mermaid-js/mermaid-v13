# How this package plugs into the shared workspace tools (tools/workspace/diagrams.ts). Not published.
# configDefaults: tools/gen-config writes src/generated/config-defaults.ts for the config section.
configDefaults: true

# grammars: tools/gen-grammar's targets, one per grammar file (`grammar/<grammar>.ebnf`): the
# type names the generated tables, `title` the syntax page, `kinds` the token kinds (D94).
grammars:
  - type: agentflow
    title: Agentflow syntax
    kinds:
      module: parser/tokens.ts
      object: T
      # As flowchart's (D467): text jison matches without returning a token.
      unnamed:
        ShapeDataEnd:
          mode: shapeData
          pattern: \}
        ClickKeyword:
          mode: INITIAL
          pattern: 'click\s+'
          docOf: CLICK
      mixed:
        - SHAPE_DATA
      documented:
        - Click
        - CallbackName

# theme: what the theme specs need from this package (tools/gen-config/src/theme-packages.ts):
# dynamicReads: names the sources build at run time, which the usedBy scan for literals can't see.
theme:
  # `themePads` (`@mermaid-js/shared/shapes/kit`, called in layout/prepare.ts) reads the shapes'
  # padding and sizes for this package: the scan does not follow this subpath (one read set per shape). These are the ones
  # agentflow's seven shapes are sized and drawn with.
  dynamicReads:
    [
      'nodePaddingX',
      'nodePaddingY',
      'hexagonPaddingX',
      'hexagonPaddingY',
      'subroutinePaddingX',
      'subroutinePaddingY',
      'leanPaddingX',
      'leanPaddingY',
      'radius',
      'hexagonSlant',
    ]

# languageBundle: what this package's ./language bundle must not reach (R-LANG-8, bench).
languageBundle:
  renderer:
    - ascii/
    - ascii.ts
    - render/
    - layout/
    - theme/
    - plugin.ts
    - labels.ts

# release: the package's row in v13/docs/RELEASING.md (`pnpm regen`).
release:
  summary: 'The agentflow diagram plugin (SVG, and text output from `/ascii`; `agentflow-beta`).'
  install: 'with `mermaid/slim`'

# credits: licence credits for pnpm check:licenses (tools/release/src/licenses.ts, R-REL-4):
# the files that must credit an upstream. Pele is a shared upstream (`SHARED_UPSTREAMS`): these
# files are local copies of flowchart's Pele-derived lexer, parser, builder, shapes and edges
# (D446, D467). mermaid's notices carry them too (its CDN build bundles this package):
# notices/mermaid.txt.
credits:
  files:
    src/parser/lexer.ts: ['Pele']
    src/parser/parser.ts: ['Pele']
    src/parser/model.ts: ['Pele']
    src/layout/prepare.ts: ['Pele']
    src/layout/shapes.ts: ['Pele']
    src/render/shapes.ts: ['Pele']
