# The config fragment of @mermaid-js/plugin-html-labels (D153, D696): the plugin's switch, out of
# core's schema. Core knows the key only while the plugin is registered. `pnpm gen:config` writes
# `src/generated/config-fragment.ts` and the plugin's section of the config reference. Same
# `x-mermaid` annotations as core's schema.
#
# v12's `htmlLabels`, `flowchart.htmlLabels` and `class.htmlLabels` alias to `html.labels`. The
# root key comes first, so it wins over a section's, as in v12. An alias is not per type: a
# section's key sets `html.labels` whatever type is drawn.
x-mermaid-fragment:
  id: html-labels
  aliases:
    - { from: htmlLabels, to: html.labels }
    - { from: flowchart.htmlLabels, to: html.labels }
    - { from: class.htmlLabels, to: html.labels }
properties:
  html:
    description: Options of `@mermaid-js/plugin-html-labels`.
    type: object
    unevaluatedProperties: false
    properties:
      labels:
        description: |
          Draws labels as HTML in the mounted diagram, as v12's `htmlLabels: true` did: raw HTML
          in a label is rendered after sanitizing, and a markdown string becomes HTML. On once
          the plugin is registered; `false` (or v12's `htmlLabels: false`) draws SVG labels.
          Only in a browser: without a DOM, in a deterministic render and in text output labels
          are SVG text. Math (`$$…$$`) and icons (`fa:…`) in an HTML label are drawn by the math
          and icons plugins, as without this plugin.
        type: boolean
        default: true
        x-mermaid: { status: honoured, since: 13.0.0 }
    x-mermaid: { status: honoured, since: 13.0.0 }
