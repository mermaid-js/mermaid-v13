name: Nightly visual baseline

# R-TEST-5, D631: every tier of the .mmd fixtures (ci.yml's `visual` job runs only `pr-check`
# and `baseline`), rendered in Chromium on mermaid-v13 every night. The screenshots go to Argos
# as their own build, `nightly`, in monitoring mode (D703): Argos compares it with the last
# nightly a maintainer approved, not with the night before, and never approves it by itself.
# Report only: a difference waits in Argos for a maintainer to look at and fails nothing here.
# Also runs on demand.
on:
  schedule:
    - cron: '53 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-nightly
  cancel-in-progress: true

jobs:
  visual:
    name: Visual baseline (nightly tiers)
    # The schedule also fires on forks; only this repository has the Argos project.
    if: github.repository == 'mermaid-js/mermaid-v13'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    # Keep this tag in sync with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      RUN_VISUAL_TEST: 'true'
      MERMAID_PORT: '9000'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'
      - run: pnpm install --frozen-lockfile
      # Only the fixture snapshots: the other specs run on every PR (ci.yml's `e2e` job). The
      # file comes before `--project`, which would otherwise take it as a project name.
      - name: Playwright (fixture snapshots, every tier)
        run: pnpm exec playwright test rendering/mmd-snapshots.spec.ts --project chromium
      - name: Upload screenshots to Argos
        if: ${{ !cancelled() }}
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
          ARGOS_REFERENCE_BRANCH: mermaid-v13
          ARGOS_BUILD_NAME: nightly
          # D703: compared with the last approved nightly and never auto-approved. In CI mode,
          # Argos approved every build on mermaid-v13 by itself, so nightly differences went
          # unseen. Monitoring builds have their own baselines; the PR builds are unaffected.
          ARGOS_MODE: monitoring
          # About 290 screenshots a part, the size the PR job's upload is known to pass with.
          ARGOS_UPLOAD_PARTS: '12'
          ARGOS_PARALLEL_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        # In parts: one upload of this many screenshots is too large for Argos to accept. The
        # version line is for the log, and it is where knip sees that @argos-ci/cli is used.
        run: |
          pnpm exec argos --version
          bash .github/scripts/argos-upload.sh e2e/screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() }}
        with:
          name: playwright-results
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
