# Alpha releases of Mermaid v13 (R-REL-1…3, D28).
#
# Every push to `mermaid-v13` (a merged PR) is versioned with Changesets in pre mode (tag
# `alpha`) and published:
#   1. version: adds a `mermaid` patch changeset if the merge brought none, runs
#      `changeset version` and pushes the `chore(release): version packages` commit.
#   2. private: `@mermaid-chart/*` to GitHub Packages, dist-tag `alpha` (publish-fork flow).
#   3. public:  `mermaid@13.0.0-alpha.N` and its `@mermaid-js/*` packages to npm, dist-tag
#      `alpha`, only when the repository variable PUBLIC_ALPHA is 'true' and the full bench
#      meets R-PERF-1…4 on the version commit. `release:publish` re-checks the gate itself.
#
# Maintainer setup (nothing here works until it is done):
#   secrets   RELEASE_BOT_TOKEN             bot/App token with contents:write that may push to
#                                           the protected mermaid-v13 branch (bypass rule)
#             MERMAID_CHART_PACKAGES_TOKEN  token with write:packages for the Mermaid-Chart org
#                                           (GitHub Packages, scope @mermaid-chart)
#             NPM_TOKEN                     npm automation token allowed to publish `mermaid` and
#                                           `@mermaid-js/*` (secret of the npm-alpha environment)
#   variable  PUBLIC_ALPHA = 'true'         turns the public job on (off by default)
#   environment npm-alpha                   restrict to branch mermaid-v13; reviewers optional
name: Release

on:
  push:
    branches: [mermaid-v13]
  workflow_dispatch:

concurrency:
  group: release-mermaid-v13
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Version packages
    if: github.repository == 'mermaid-js/mermaid-v13' && !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          # A bot token allowed to push to the protected mermaid-v13 branch.
          token: ${{ secrets.RELEASE_BOT_TOKEN }}
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'
      - run: pnpm install --frozen-lockfile
      - name: Add a changeset if the merge brought none
        run: pnpm release:ensure-changeset ${{ github.sha }}
      - name: Version (pre mode, alpha)
        run: pnpm changeset version
        env:
          # @changesets/changelog-github looks up the PR and author of each changeset.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm exec prettier --write .changeset "packages/*/package.json" "packages/*/CHANGELOG.md"
      - name: Commit and push the version commit
        id: commit
        run: |
          git config user.name "mermaid-release-bot"
          git config user.email "mermaid-release-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): version packages"
          git push origin HEAD:mermaid-v13
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  private:
    name: Private alpha (GitHub Packages)
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mermaid-chart'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:licenses
      - run: pnpm build
      - name: Pack, leak-gate and publish @mermaid-chart/* with tag alpha
        run: pnpm release:publish --target private
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MERMAID_CHART_PACKAGES_TOKEN }}

  public:
    name: Public alpha (npm), gated on R-PERF-1…4
    needs: [version, private]
    if: vars.PUBLIC_ALPHA == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: npm-alpha
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      BENCH_RUNNER: github-ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mermaid-js/bench exec playwright install --with-deps chromium
      - name: Full bench (report mode; the release gate decides)
        run: pnpm --filter @mermaid-js/bench bench --mode report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-bench-report
          path: packages/bench/dist/reports/
          if-no-files-found: ignore
      - name: Public alpha gate (R-PERF-1…4)
        run: pnpm release:public-gate packages/bench/dist/reports/latest.json --commit ${{ needs.version.outputs.sha }}
      - run: pnpm build
      - name: Pack, leak-gate and publish mermaid with tag alpha
        run: pnpm release:publish --target public --gate packages/bench/dist/reports/latest.json --commit ${{ needs.version.outputs.sha }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
