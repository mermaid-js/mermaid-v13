# Manual alpha release to npm (v13/docs/RELEASING.md §5), run from the Actions tab or
# `gh workflow run release-alpha.yml -f dry_run=false`. The same steps as the release-alpha skill:
#   preflight → pnpm check → changeset version (when changesets are pending) → build →
#   rehearsal on a local registry → push the version commit → publish → tag.
# Only versions not on npm yet are published, so a flowchart changeset ships
# @mermaid-js/diagram-flowchart and mermaid, nothing else. A failed run is safe to re-run.
#
# Built for this private repository: npm provenance needs a public one, so it is off, and the
# public-alpha bench gate (R-REL-3) is skipped with the reason given on dispatch (the nightly
# bench watches performance). release.yml, the publish-on-every-merge flow, stays off.
#
# Maintainer setup:
#   environment npm-alpha     restrict to branch mermaid-v13; add required reviewers to approve
#                             each release before it starts
#   secret NPM_TOKEN          (in npm-alpha) granular npm token that may publish `mermaid` and
#                             `@mermaid-js/*`, without 2FA prompts
#   secret RELEASE_BOT_TOKEN  token allowed to push to the protected mermaid-v13 branch
name: Release alpha (manual)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (version, build and rehearse; push and publish nothing)
        type: boolean
        default: true
      gate_reason:
        description: Why the R-PERF bench gate is skipped (printed with the publish)
        type: string
        default: manual alpha, nightly bench
        required: true

concurrency:
  group: release-mermaid-v13
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release alpha${{ inputs.dry_run && ' (dry run)' || '' }}
    if: github.ref == 'refs/heads/mermaid-v13'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    environment: npm-alpha
    permissions:
      contents: write
      actions: read # the newest nightly bench report, shown when the gate is skipped
    env:
      # `changeset version` looks up each changeset's PR for the changelog; preflight checks it.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - name: Preflight (plan, npm login)
        run: pnpm release:preflight
      - run: pnpm check
      - name: Version pending changesets
        id: version
        run: |
          pnpm changeset version
          pnpm release:sync-version
          pnpm exec prettier --write .changeset "packages/*/package.json"
          if git diff --quiet; then
            echo "No pending changesets; publishing any versions not on npm yet."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "mermaid-release-bot"
            git config user.email "mermaid-release-bot@users.noreply.github.com"
            git add -A
            git commit -m "chore(release): version packages"
            git show --stat HEAD
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm build
      - name: Rehearse on a local registry
        run: pnpm release:rehearse
      - name: Push the version commit
        if: ${{ !inputs.dry_run && steps.version.outputs.committed == 'true' }}
        run: git push origin HEAD:mermaid-v13
      - name: Publish to npm with tag alpha
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          GATE_REASON: ${{ inputs.gate_reason }}
        run: |
          # shellcheck disable=SC2086 # DRY_RUN is empty or one flag
          pnpm release:publish --target public --no-provenance --skip-gate "$GATE_REASON" $DRY_RUN \
            | tee "$RUNNER_TEMP/publish.log"
          {
            echo "### npm ($([ -n "$DRY_RUN" ] && echo 'dry run' || echo 'tag alpha'))"
            grep -E '^(published|would publish|already published):' "$RUNNER_TEMP/publish.log" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Tag the released versions
        if: ${{ !inputs.dry_run }}
        run: |
          pnpm changeset tag
          git push origin --tags
