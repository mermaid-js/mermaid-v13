name: CI

on:
  push:
    branches: [mermaid-v13]
  merge_group:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    # What this run has to check (tools/ci/scope.ts). `code`: everything. `docs`: the change
    # touches only documentation, by the pre-push hook's rule, so only `lint` runs (Prettier
    # and the generated-file checks) plus, in `docs-tests`, the tests of the code that reads a
    # changed docs file. On a PR that changes only TypeScript source of packages, `.mmd`
    # fixtures and vitest snapshots (besides docs and changesets), `tests` is `related` and
    # `test_files` lists the unit tests the change can reach (D637, D648); the unit shards run
    # those. Every doubt ends in `code` with every test. The other jobs read these outputs.
    name: Scope
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      readers: ${{ steps.scope.outputs.readers }}
      tests: ${{ steps.scope.outputs.tests }}
      test_files: ${{ steps.scope.outputs.test_files }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # HEAD^1..HEAD is the change: on a PR the checkout is the merge commit.
          fetch-depth: 2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'
      - run: pnpm install --frozen-lockfile
      - id: scope
        run: pnpm exec tsx tools/ci/scope-cli.ts

  docs-tests:
    # The tests of the code that reads a changed docs file or the changesets (a spec that
    # checks the D-ids in DECISIONS.md, the release tooling): `vitest related` runs the specs
    # among those readers and the specs that import them. It runs in a `docs` run, and in a
    # `related` run that has docs or changesets beside its source (D637). The Scope job lists
    # no readers when every test runs anyway.
    name: Tests of code that reads the docs
    needs: changes
    if: ${{ needs.changes.outputs.readers != '' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      READERS: ${{ needs.changes.outputs.readers }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'
      - run: pnpm install --frozen-lockfile
      # Unquoted on purpose: one argument per file. The paths come from `git grep` in this
      # repository and hold no spaces.
      - run: |
          # shellcheck disable=SC2086
          pnpm vitest related --run $READERS

  # `pnpm check:static` runs as two parallel jobs, `lint` and `typecheck`, with `build` beside
  # them; the unit tests (the rest of `pnpm check`) run sharded in `tests`. Keep the commands
  # of `lint` and `typecheck` in step with the `check:static` script in package.json: between
  # them they run every part of it.
  lint:
    # ESLint, Prettier, cspell, knip, runtime dependencies (R-PERF-2), licenses (R-REL-4),
    # generated config (R-CONF-4) and generated grammar files (R-PARSE-9).
    name: Lint and static checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'
      - run: pnpm install --frozen-lockfile
      # ESLint's and Prettier's caches (both keyed on file content). A push to mermaid-v13
      # lints every file from scratch and saves the result; a pull request restores the newest
      # one and lints only the files whose content differs. ESLint does not re-lint an unchanged
      # file when a type it uses changed elsewhere, so a type-aware finding in such a file shows
      # on the push after the merge, not on the pull request; `typecheck` still checks every
      # file on every run.
      - name: Restore the lint caches
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .eslintcache
            node_modules/.cache/prettier
          key: lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js') }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js') }}-
      - run: pnpm lint
      - name: Save the lint caches
        if: github.event_name == 'push'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .eslintcache
            node_modules/.cache/prettier
          key: lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js') }}-${{ github.sha }}
      - run: pnpm lint:knip
      - run: pnpm check:deps
      - run: pnpm check:licenses
      - run: pnpm check:config
      - run: pnpm check:grammar

  typecheck:
    name: Typecheck
    needs: changes
    if: ${{ needs.changes.outputs.scope == 'code' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  build:
    name: Build
    needs: changes
    if: ${{ needs.changes.outputs.scope == 'code' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  structure:
    # #722: `fallow audit` on the files this change touches, against the base (HEAD^1: the base
    # branch on a PR, whose checkout is the merge commit; the previous tip on a push). It fails
    # on findings the change introduces: dead code, import cycles, boundary violations (the
    # zones in .fallowrc.json), complexity above the thresholds and new duplication. Findings
    # the base already has are reported, not failed. D640: it runs no tests and reads no
    # coverage, so fallow only estimates CRAP scores. .fallowrc.pr.json extends .fallowrc.json
    # and makes CRAP findings warnings; every other finding still fails. Exact CRAP, from the
    # full unit suite's coverage, gates in the nightly run (fallow-nightly.yml).
    name: Structural audit
    needs: changes
    if: ${{ needs.changes.outputs.scope == 'code' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'
      - run: pnpm install --frozen-lockfile
      - name: fallow audit
        run: pnpm exec fallow audit -c .fallowrc.pr.json --base HEAD^1 --quiet --format github-annotations
      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          pnpm exec fallow audit -c .fallowrc.pr.json --base HEAD^1 --quiet --format github-summary >> "$GITHUB_STEP_SUMMARY" || true

  checks:
    # The one check to require on the branch: green only when the scope was decided and lint,
    # typecheck, build, the structural audit, every unit test shard and the docs tests each
    # passed or were left out by the scope (a `docs` run skips all but lint and the docs
    # tests). A job that is skipped because `changes` failed does not pass: `changes` itself
    # must succeed. It keeps the name the single job had before it was split.
    name: Check and build
    if: ${{ always() }}
    needs: [changes, lint, typecheck, build, structure, tests, docs-tests]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - env:
          SCOPE: ${{ needs.changes.result }}
          LINT: ${{ needs.lint.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes, lint, typecheck, build, structure, tests, docs-tests: $RESULTS"
          if [ "$SCOPE" != "success" ] || [ "$LINT" != "success" ]; then exit 1; fi
          for result in $RESULTS; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then exit 1; fi
          done

  tests:
    # `pnpm test` (the rest of `pnpm check`) split across runners: about 13 minutes on one 4-vCPU runner, CPU-bound,
    # four-fifths of it packages/conformance. Vitest shards by file; each shard runs every
    # project's share, gantt's two zones and the serial language-budget group included.
    # Six shards, filled by measured duration rather than equal file counts (#984,
    # tools/ci/duration-sequencer.ts). Each shard uploads a JSON report as `unit-durations-<n>`;
    # tools/ci/durations-cli.ts turns a run's six reports into tools/ci/test-durations.json.
    # A `related` run (D637) gives vitest the Scope job's list of test files: those the import
    # graph finds affected by the change, the owners of changed snapshots and the readers of
    # the e2e corpus when a fixture changed (D648), and those that read the tree without
    # importing it. A push to mermaid-v13 always runs every test, which catches one a PR
    # wrongly left out.
    name: Unit tests (${{ matrix.shard }}/6)
    needs: changes
    if: ${{ needs.changes.outputs.scope == 'code' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        env:
          TESTS: ${{ needs.changes.outputs.tests }}
          TEST_FILES: ${{ needs.changes.outputs.test_files }}
          SHARD: ${{ matrix.shard }}/6
          # The default reporter for the log, and a JSON report of each file's duration.
          REPORT: --reporter=default --reporter=json --outputFile.json=unit-durations.json
        # TEST_FILES is unquoted on purpose: one argument per file. The paths come from git
        # and vitest in this repository and hold no spaces. An empty list would mean no
        # filter, so every test: the Scope job never reports `related` with an empty list,
        # and this step runs them all if it ever does.
        # REPORT is unquoted too: it holds three options.
        run: |
          # shellcheck disable=SC2086
          if [ "$TESTS" = "related" ] && [ -n "$TEST_FILES" ]; then
            pnpm test --shard="$SHARD" $REPORT --passWithNoTests $TEST_FILES
          else
            pnpm test --shard="$SHARD" $REPORT
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: unit-durations-${{ matrix.shard }}
          path: unit-durations.json
          retention-days: 14
          if-no-files-found: ignore

  bench:
    # R-TEST-7, the PR check (packages/bench/src/pr-check.ts), about two minutes:
    # - Loaded size (R-PERF-1) and corpus renders (R-PERF-4, once each in Node) enforce.
    # - v13 against this PR's base branch (the merge commit's first parent) and Pele: CPU
    #   instruction counts in Node, steady to ~1% on a shared runner. Reported only.
    # - A small browser run of v13 and mermaid@12 on 5 diagrams: Ready at (R-PERF-9), indicative speed.
    # Speed over the corpus (R-PERF-3) and stage timings run in the nightly and release bench
    # (bench-nightly.yml, release.yml). On a PR from this repository the result is posted as a
    # PR comment, updated in place on every run; fork PRs get a read-only token and only the artifact.
    name: Bench gates
    needs: changes
    if: ${{ needs.changes.outputs.scope == 'code' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      BENCH_RUNNER: blacksmith-4vcpu-ubuntu-2404
      BENCH_REPORT_ONLY: speed
      # The commit the report names: on a PR its head, as GitHub shows it. The checkout itself
      # is the merge of the PR into the base (refs/pull/N/merge), which the report notes.
      BENCH_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # HEAD^1 is the base for v13-base: the base branch on a PR (HEAD is the merge
          # commit), the previous tip on a push.
          fetch-depth: 2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'
      - run: pnpm install --frozen-lockfile
      # Chromium: the browser download is cached per Playwright version; its system packages are
      # installed only when it cannot start (the runner image usually has them already).
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @mermaid-js/bench exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Chromium
        working-directory: packages/bench
        run: |
          pnpm exec playwright install chromium
          if ! node -e "require('@playwright/test').chromium.launch().then((b) => b.close())"; then
            echo "Chromium cannot start; installing its system packages"
            pnpm exec playwright install-deps chromium
          fi
      # perf for the instruction counts (packages/bench/src/instruction-counts.ts): the image's own
      # when it has one for this kernel, else from apt. Without it the counts are skipped.
      - name: perf and user-space counters
        run: |
          if ls /usr/lib/linux-tools/*/perf > /dev/null 2>&1; then
            echo "perf already installed: $(ls -d /usr/lib/linux-tools/*/)"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq linux-tools-common linux-tools-generic > /dev/null || true
          fi
          sudo sysctl -w kernel.perf_event_paranoid=1 || true
      - run: pnpm --filter @mermaid-js/bench pr --base HEAD^1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bench-report
          path: packages/bench/dist/reports/
          if-no-files-found: ignore
      - name: Post the bench report on the PR
        if: >-
          !cancelled() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          hashFiles('packages/bench/dist/reports/comment.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BODY: packages/bench/dist/reports/comment.md
        run: |
          # The comment starts with a marker line (COMMENT_MARKER in packages/bench/src/pr-markdown.ts).
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- mermaid-v13-bench -->"))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$BODY" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F "body=@$BODY" > /dev/null
          fi

  visual:
    # R-TEST-5, D631: the `pr-check` and `baseline` tiers of the .mmd fixtures whose diagram
    # types have a v13 package (e2e/helpers/mmd-snapshots.ts), in the Playwright image so fonts
    # and rendering are fixed. Every tier runs each night (visual-nightly.yml). This job only
    # takes screenshots; the specs that assert behaviour are the `e2e` job below.
    # A push photographs every fixture of the two tiers: that build is the baseline. A PR
    # photographs only the fixtures it renders differently (packages/dev's visual-scope: every
    # fixture is rendered to SVG in Node on the PR and on its base, and the hashes compared) and
    # uploads them as an Argos subset build, which is never a baseline; with none, it tells
    # Argos to skip. The label `visual: full` on the PR photographs everything.
    # Screenshots go to Argos, which compares a PR with the newest mermaid-v13 build (R-REL-1)
    # and reports the differences on the PR for a maintainer to approve. Report only: this job
    # is not part of `checks`, and the Argos status is not a required check. R-TEST-6: the theme
    # gallery is built from the same fixtures and kept as an artifact.
    name: Visual baseline
    needs: changes
    # A docs-only PR still runs: its scope step decides `skip` and tells Argos so, which gives
    # the PR its Argos status. A docs-only push has no baseline to renew.
    if: ${{ needs.changes.outputs.scope == 'code' || github.event_name == 'pull_request' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    # Keep this tag in sync with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      RUN_VISUAL_TEST: 'true'
      MERMAID_PORT: '9000'
      # A push to mermaid-v13 runs the same tiers as a PR, so the two builds hold the same
      # screenshots and Argos can tell a removed fixture from one that did not run.
      MERMAID_E2E_FIXTURE_TIER: pr-check,baseline
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # HEAD^1 is the base the scope step compares with: the base branch on a PR (HEAD is
          # the merge commit).
          fetch-depth: 2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'
      - run: pnpm install --frozen-lockfile
      # Outputs `mode` (full, subset or skip) and, for subset, `list`: the file of fixtures to
      # photograph. The job summary says which and why. A failed comparison ends in `full`.
      - name: Decide what to photograph
        id: scope
        env:
          VISUAL_PR: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm --silent --filter @mermaid-js/dev visual:scope
      # The file comes before `--project`, which would otherwise take it as a project name.
      - name: Playwright (fixture snapshots)
        if: ${{ steps.scope.outputs.mode != 'skip' }}
        env:
          MERMAID_E2E_FIXTURE_LIST: ${{ steps.scope.outputs.list }}
        run: pnpm exec playwright test rendering/mmd-snapshots.spec.ts --project chromium
      - name: Upload screenshots to Argos
        if: ${{ !cancelled() && steps.scope.outputs.mode != 'skip' && github.event_name != 'merge_group' }}
        env:
          # 'true' or 'false', never empty: the CLI reads anything but 'false' as true.
          ARGOS_SUBSET: ${{ steps.scope.outputs.mode == 'subset' }}
          # Empty on forks; Argos falls back to tokenless upload for public repositories.
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
          ARGOS_REFERENCE_BRANCH: mermaid-v13
          ARGOS_PARALLEL_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        # In parts: one upload of this many screenshots is too large for Argos to accept. The
        # version line is for the log, and it is where knip sees that @argos-ci/cli is used.
        run: |
          pnpm exec argos --version
          bash .github/scripts/argos-upload.sh e2e/screenshots
      # Nothing to photograph: Argos still gets a build, so the PR has a green Argos status.
      - name: Tell Argos there is nothing to compare
        if: ${{ steps.scope.outputs.mode == 'skip' && github.event_name == 'pull_request' }}
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
        run: pnpm exec argos skip
      - name: Build the theme gallery
        run: pnpm --filter @mermaid-js/dev gallery
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: theme-gallery
          path: packages/dev/dist/gallery/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() }}
        with:
          name: playwright-results
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

  e2e:
    # What `pnpm e2e` runs besides the fixture snapshots: the browser adapter specs
    # (e2e/browser), the dev explorer specs (e2e/dev, project `dev`; #64), the language-service
    # editors (e2e/language) and the plugin-platform apps (e2e/platform). They assert behaviour
    # and take no screenshots, so they have their own job and their own result. In the
    # Playwright image, like the snapshots, so the measurer specs see the same fonts.
    # Two parts run side by side (#982), picked by E2E_PART in playwright.config.ts: `platform`
    # (e2e/platform, whose apps share one workspace build, so it is not split further) and
    # `rest` (everything else, and any new spec folder). Together they run every spec once.
    name: ${{ matrix.part == 'platform' && 'Platform specs' || 'Browser and dev explorer specs' }}
    needs: changes
    if: ${{ needs.changes.outputs.scope == 'code' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [platform, rest]
    # Keep this tag in sync with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      MERMAID_PORT: '9000'
      E2E_PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'
      - run: pnpm install --frozen-lockfile
      # The Compare tab's CDN specs need cdn.jsdelivr.net and registry.npmjs.org; without them
      # they skip, with a warning annotation and a job summary line giving the reason.
      - name: Playwright (${{ matrix.part }}; every spec but the fixture snapshots)
        run: pnpm e2e --grep-invert "mmd snapshots"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() }}
        with:
          name: playwright-results-e2e-${{ matrix.part }}
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

  dom-adapter:
    # #16 (R-API-6/7, R-ERR-3, R-THEME-3, R-TEXT-5): run(), mount(), the error image and
    # afterMount, from source through e2e/dom's own page server. Chromium only until the POC
    # is done; Firefox and WebKit come back with the rest of the browser matrix.
    name: DOM adapter
    needs: changes
    if: ${{ needs.changes.outputs.scope == 'code' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    # In the Playwright image, like `e2e`: Chromium and its system packages are in the image,
    # so the job installs no browser (#993). Keep this tag in sync with @playwright/test in
    # package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e:dom --project=chromium

  # Each target renders a fixture through the public `mermaid` package. Deno, the Web Worker,
  # Firefox and WebKit come back after the POC. The two targets are separate jobs because only
  # chromium runs in the Playwright image (#993).
  smoke-render:
    # node20 runs the source through tsx, on Node 20 and without a browser.
    name: Smoke render (node20)
    needs: changes
    if: ${{ needs.changes.outputs.scope == 'code' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version: '20'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mermaid-js/conformance smoke

  smoke-render-chromium:
    # chromium loads the BUILT package as one bundled ES module from the e2e page server
    # (e2e/smoke/smoke.spec.ts). In the Playwright image, like `e2e`, so it installs no browser.
    # It builds `mermaid` and the packages it depends on, not every package: the Build job
    # builds them all. It does not take Build's output instead: `needs: build` would put
    # Build's whole job (about 45 s) in front of this one to save its 40 s of building (#993).
    name: Smoke render (chromium)
    needs: changes
    if: ${{ needs.changes.outputs.scope == 'code' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    # Keep this tag in sync with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      MERMAID_PORT: '9000'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'
      - run: pnpm install --frozen-lockfile
      - name: Build the package and the smoke bundle
        run: |
          pnpm --filter "mermaid..." run build
          pnpm --filter @mermaid-js/dev smoke:build
      - name: Render in Chromium
        run: pnpm exec playwright test --project smoke-chromium -g "main thread"
