name: CI

on:
  push:
    branches-ignore:
      - 'renovate/**'
  merge_group:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: Lint, run: pnpm lint }
          - { name: Typecheck, run: pnpm typecheck }
          - { name: Unit tests, run: pnpm test }
          # R-PERF-2: core and first-party diagram packages declare no runtime dependencies.
          - { name: Runtime dependencies, run: pnpm check:deps }
          # R-CONF-4: generated config types, defaults and docs match the schema.
          - { name: Generated config, run: pnpm check:config }
          - { name: Build, run: pnpm build }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.check.run }}

  smoke-render:
    # Placeholder matrix: each target renders a fixture through the public `mermaid` package
    # once the render API exists (DESIGN §15 item 14). Until then the job only reserves the
    # runtimes so the matrix is visible and required from the start.
    name: Smoke render (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node20, deno, worker, chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Smoke render
        run: echo "Smoke render on ${{ matrix.runtime }} is not implemented yet (needs the render API)."
