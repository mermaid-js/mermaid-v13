name: CI

on:
  push:
    branches-ignore:
      - 'renovate/**'
  merge_group:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: Lint, run: pnpm lint }
          - { name: Typecheck, run: pnpm typecheck }
          - { name: Unit tests, run: pnpm test }
          # R-PERF-2: core and first-party diagram packages declare no runtime dependencies.
          - { name: Runtime dependencies, run: pnpm check:deps }
          # R-CONF-4: generated config types, defaults and docs match the schema.
          - { name: Generated config, run: pnpm check:config }
          # R-PARSE-9: highlighters and syntax docs match the grammar files.
          - { name: Generated grammar files, run: pnpm check:grammar }
          - { name: Build, run: pnpm build }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.check.run }}

  bench:
    # R-TEST-7: the bench gates (packages/bench): loaded size (R-PERF-1), warm geomean vs frozen
    # mermaid@12.2.0 dagre (R-PERF-3), corpus OK count (R-PERF-4), stage regression against the
    # baseline stored for this runner (R-PERF-7) and "Ready at" (R-PERF-9, reported only).
    # Gate mode defaults to `enforce` (the pipeline probe must pass). No baseline is stored for GitHub-hosted runners yet (O-4), so R-PERF-7
    # reports here until one is.
    name: Bench gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BENCH_RUNNER: github-ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mermaid-js/bench exec playwright install --with-deps chromium
      - run: pnpm --filter @mermaid-js/bench bench
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bench-report
          path: packages/bench/dist/reports/
          if-no-files-found: ignore

  visual:
    # R-TEST-5: the v13 visual baseline (e2e/diagrams/flowchart/baseline, tier `baseline`) plus the
    # browser adapter specs (e2e/browser), in the Playwright image so fonts and rendering are fixed.
    # Screenshots go to Argos, which compares them with the develop baseline on PRs. R-TEST-6: the
    # theme gallery is built from the same fixtures and kept as an artifact.
    name: Visual baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Keep this tag in sync with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      RUN_VISUAL_TEST: 'true'
      MERMAID_PORT: '9000'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'
      - run: pnpm install --frozen-lockfile
      - name: Playwright (baseline + browser specs)
        run: pnpm e2e
      - name: Upload screenshots to Argos
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
        env:
          # Empty on forks; Argos falls back to tokenless upload for public repositories.
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
        run: pnpm exec argos upload e2e/screenshots
      - name: Build the theme gallery
        run: pnpm --filter @mermaid-js/visual gallery
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: theme-gallery
          path: packages/visual/dist/gallery/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() }}
        with:
          name: playwright-results
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

  smoke-render:
    # Each target renders a fixture through the public `mermaid` package. node20 runs the
    # source through tsx. The others load the BUILT package as one bundled ES module
    # (packages/visual `smoke:build`): Deno runs it directly; the browsers and a Web Worker
    # (in Chromium) load it from the e2e page server (e2e/smoke/smoke.spec.ts).
    name: Smoke render (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [node20, deno, worker, chromium, firefox, webkit]
    env:
      MERMAID_PORT: '9000'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version: ${{ matrix.runtime == 'node20' && '20' || '' }}
          node-version-file: ${{ matrix.runtime != 'node20' && '.node-version' || '' }}
      - run: pnpm install --frozen-lockfile
      - if: matrix.runtime == 'node20'
        run: pnpm --filter @mermaid-js/conformance smoke
      - name: Build the package and the smoke bundle
        if: matrix.runtime != 'node20'
        run: pnpm build && pnpm --filter @mermaid-js/visual smoke:build
      - if: matrix.runtime == 'deno'
        run: pnpm --filter @mermaid-js/visual smoke:deno
      - name: Install the browser
        if: contains(fromJSON('["worker","chromium","firefox","webkit"]'), matrix.runtime)
        run: pnpm exec playwright install --with-deps ${{ matrix.runtime == 'worker' && 'chromium' || matrix.runtime }}
      - if: matrix.runtime == 'worker'
        run: pnpm exec playwright test --project smoke-chromium -g "Web Worker"
      - if: matrix.runtime == 'chromium'
        run: pnpm exec playwright test --project smoke-chromium -g "main thread"
      - if: matrix.runtime == 'firefox' || matrix.runtime == 'webkit'
        run: pnpm exec playwright test --project smoke-${{ matrix.runtime }}
