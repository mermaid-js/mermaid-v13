name: CI

on:
  push:
    branches: [mermaid-v13]
  merge_group:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    # `pnpm check`: lint, typecheck, unit tests, runtime dependencies (R-PERF-2), licenses
    # (R-REL-4), generated config (R-CONF-4) and generated grammar files (R-PARSE-9).
    name: Check and build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  bench:
    # R-TEST-7, the PR check (packages/bench/src/pr-check.ts), about two minutes:
    # - Loaded size (R-PERF-1) and corpus renders (R-PERF-4, once each in Node) enforce.
    # - v13 against this PR's base branch (the merge commit's first parent) and Pele: CPU
    #   instruction counts in Node, steady to ~1% on a shared runner. Reported only.
    # - A small browser run of v13 and mermaid@12 on 5 diagrams: Ready at (R-PERF-9), indicative speed.
    # Speed over the corpus (R-PERF-3) and stage timings run in the nightly and release bench
    # (bench-nightly.yml, release.yml). On a PR from this repository the result is posted as a
    # PR comment, updated in place on every run; fork PRs get a read-only token and only the artifact.
    name: Bench gates
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      BENCH_RUNNER: blacksmith-4vcpu-ubuntu-2404
      BENCH_REPORT_ONLY: speed
      # The commit the report names: on a PR its head, as GitHub shows it. The checkout itself
      # is the merge of the PR into the base (refs/pull/N/merge), which the report notes.
      BENCH_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # HEAD^1 is the base for v13-base: the base branch on a PR (HEAD is the merge
          # commit), the previous tip on a push.
          fetch-depth: 2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mermaid-js/bench exec playwright install --with-deps chromium
      # perf for the instruction counts (packages/bench/src/instruction-counts.ts). Without it
      # they are skipped and the comment says so.
      - name: Install perf and allow user-space counters
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-tools-common linux-tools-generic > /dev/null || true
          sudo sysctl -w kernel.perf_event_paranoid=1 || true
      - run: pnpm --filter @mermaid-js/bench pr --base HEAD^1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bench-report
          path: packages/bench/dist/reports/
          if-no-files-found: ignore
      - name: Post the bench report on the PR
        if: >-
          !cancelled() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          hashFiles('packages/bench/dist/reports/comment.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BODY: packages/bench/dist/reports/comment.md
        run: |
          # The comment starts with a marker line (COMMENT_MARKER in packages/bench/src/pr-markdown.ts).
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- mermaid-v13-bench -->"))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$BODY" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F "body=@$BODY" > /dev/null
          fi

  visual:
    # R-TEST-5: every .mmd tier of the fixture folders whose diagram types have a v13 package
    # (e2e/helpers/mmd-snapshots.ts) plus the browser adapter specs (e2e/browser), in the
    # Playwright image so fonts and rendering are fixed.
    # Screenshots go to Argos, which compares them with the mermaid-v13 baseline on PRs (R-REL-1). R-TEST-6: the
    # theme gallery is built from the same fixtures and kept as an artifact.
    name: Visual baseline
    # Paused until the baseline settles: set the repository variable VISUAL_BASELINE to 'true'.
    if: vars.VISUAL_BASELINE == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    # Keep this tag in sync with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      RUN_VISUAL_TEST: 'true'
      MERMAID_PORT: '9000'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'
      - run: pnpm install --frozen-lockfile
      # `pnpm e2e` also runs the dev explorer specs (e2e/dev, project `dev`; #64). The Compare
      # tab's CDN specs need cdn.jsdelivr.net and registry.npmjs.org; without them they skip,
      # with a warning annotation and a job summary line giving the reason.
      - name: Playwright (baseline, browser and dev explorer specs)
        run: pnpm e2e
      - name: Upload screenshots to Argos
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
        env:
          # Empty on forks; Argos falls back to tokenless upload for public repositories.
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
          ARGOS_REFERENCE_BRANCH: mermaid-v13
        run: pnpm exec argos upload e2e/screenshots
      - name: Build the theme gallery
        run: pnpm --filter @mermaid-js/dev gallery
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: theme-gallery
          path: packages/dev/dist/gallery/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() }}
        with:
          name: playwright-results
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

  dom-adapter:
    # #16 (R-API-6/7, R-ERR-3, R-THEME-3, R-TEXT-5): run(), mount(), the error image and
    # afterMount, from source through e2e/dom's own page server. Chromium only until the POC
    # is done; Firefox and WebKit come back with the rest of the browser matrix.
    name: DOM adapter
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:dom --project=chromium

  smoke-render:
    # Each target renders a fixture through the public `mermaid` package. node20 runs the
    # source through tsx; chromium loads the BUILT package as one bundled ES module from the
    # e2e page server (e2e/smoke/smoke.spec.ts). Deno, the Web Worker, Firefox and WebKit
    # come back after the POC.
    name: Smoke render (${{ matrix.runtime }})
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [node20, chromium]
    env:
      MERMAID_PORT: '9000'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version: ${{ matrix.runtime == 'node20' && '20' || '' }}
          node-version-file: ${{ matrix.runtime != 'node20' && '.node-version' || '' }}
      - run: pnpm install --frozen-lockfile
      - if: matrix.runtime == 'node20'
        run: pnpm --filter @mermaid-js/conformance smoke
      - if: matrix.runtime == 'chromium'
        name: Build the package and the smoke bundle, then render in Chromium
        run: |
          pnpm build
          pnpm --filter @mermaid-js/dev smoke:build
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test --project smoke-chromium -g "main thread"
