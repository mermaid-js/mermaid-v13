name: Nightly structure

# #722: the full fallow run on mermaid-v13 every night, where the PR's structural audit (ci.yml)
# looks only at the files a change touches. Dead code, import cycles and boundaries, duplication
# and complexity over the whole tree, against the committed baselines in .fallow-baseline/, with
# CRAP scores from the full unit suite's coverage; then a type-aware dead-code pass. The report
# is the job summary and a SARIF artifact. (Code scanning upload needs GitHub Advanced Security
# on this private repository, so the SARIF stays an artifact.) Also runs on demand.
#
# #911 (D652): when the fallow step fails on mermaid-v13 (on the schedule or by hand), one open
# `nightly-fallow` issue gets the run link and the report (opened when there is none), and a
# short Slack message names the gates and links both. A later green run comments on that issue
# and closes it. Neither alert job checks out or runs repository code; only the Slack job sees
# its token.
on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fallow-nightly
  cancel-in-progress: true

jobs:
  fallow:
    name: Full fallow run
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    outputs:
      # success or failure when the fallow step ran; empty or skipped when the job failed first.
      outcome: ${{ steps.fallow.outcome }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Hotspots and ownership read the history.
          fetch-depth: 0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'
      - run: pnpm install --frozen-lockfile
      # Coverage for the CRAP scores. The timing projects stay out (coverage slows code
      # unevenly); test verdicts belong to CI, so a failure here does not stop the run.
      - name: Unit tests with coverage
        continue-on-error: true
        run: pnpm vitest run --coverage --project workspace --project gantt-utc --project gantt-la
      - name: fallow (dead code, architecture, duplication, complexity)
        id: fallow
        run: >-
          pnpm exec fallow --quiet
          --baseline .fallow-baseline/dead-code.json
          --dupes-baseline .fallow-baseline/dupes.json
          --health-baseline .fallow-baseline/health.json
          --coverage coverage/coverage-final.json
          --sarif-file fallow.sarif --fail-on-issues
          --format github-summary --output-file fallow-summary.md
      # Reported, not gated: it cross-checks the syntactic pass above, which gates. (A type-aware
      # baseline is tied to the config's hash, so it would go stale on every config change.)
      - name: Type-aware dead code
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: >-
          pnpm exec fallow dead-code --quiet --type-aware
          --format markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Job summary
        if: ${{ !cancelled() }}
        run: if [ -f fallow-summary.md ]; then cat fallow-summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: fallow-sarif
          path: fallow.sarif
          if-no-files-found: ignore
      # The report, for the alert jobs below.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: fallow-summary
          path: fallow-summary.md
          if-no-files-found: ignore

  tracking-issue:
    name: Tracking issue
    needs: fallow
    if: >-
      ${{ !cancelled() && github.ref_name == 'mermaid-v13'
      && contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name)
      && contains(fromJSON('["success", "failure"]'), needs.fallow.outputs.outcome) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    outputs:
      url: ${{ steps.issue.outputs.url }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: fallow-summary
      - name: Open, update or close the nightly-fallow issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ needs.fallow.outputs.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          open=$(gh issue list --state open --label nightly-fallow --limit 1 --json number,url \
            --jq '.[0] // empty | "\(.number) \(.url)"')
          if [ "$OUTCOME" = success ]; then
            if [ -n "$open" ]; then
              gh issue comment "${open%% *}" --body "The nightly fallow run is green again: $RUN_URL"
              gh issue close "${open%% *}"
            fi
            exit 0
          fi
          # The report, cut well below GitHub's 65 536-character limit for a body.
          limit=60000
          if [ -f fallow-summary.md ]; then
            report=$(head -c "$limit" fallow-summary.md)
            if [ "$(wc -c < fallow-summary.md)" -gt "$limit" ]; then
              report="$report"$'\n\n_Cut here; the whole report is the run\'s job summary._'
            fi
          else
            report='_No report: fallow wrote none. See the run log._'
          fi
          # shellcheck disable=SC2016 # backticks are Markdown, not command substitution
          printf 'The nightly fallow run on `mermaid-v13` failed: %s\n\n%s\n' "$RUN_URL" "$report" > body.md
          if [ -n "$open" ]; then
            gh issue comment "${open%% *}" --body-file body.md
            url=${open#* }
          else
            gh label create nightly-fallow --color B60205 \
              --description 'The nightly fallow run failed (fallow-nightly.yml)' 2>/dev/null || true
            url=$(gh issue create --title 'Nightly fallow run is red' --label nightly-fallow \
              --body-file body.md)
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

  slack:
    name: Slack
    needs: [fallow, tracking-issue]
    if: ${{ !cancelled() && needs.tracking-issue.result == 'success' && needs.fallow.outputs.outcome == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: fallow-summary
      # The bot token is mermaid-ops's (comp-status). The bot must be in the channel.
      - name: Post to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL: ${{ vars.FALLOW_SLACK_CHANNEL_ID }}
          ISSUE_URL: ${{ needs.tracking-issue.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$CHANNEL" ]; then
            echo "::notice::Slack skipped: set the SLACK_BOT_TOKEN secret and the FALLOW_SLACK_CHANNEL_ID variable."
            exit 0
          fi
          # fallow's own line: `Gate outcomes: failed <gate> (<count> …), …; passed …`.
          gates=$(grep -m1 '^Gate outcomes:' fallow-summary.md 2>/dev/null || echo 'Gate outcomes: no report, see the run.')
          # shellcheck disable=SC2016 # backticks are Markdown, not command substitution
          text=$(printf '*Nightly fallow is red* on `mermaid-v13`.\n%s\nIssue: %s · Run: %s' \
            "$gates" "$ISSUE_URL" "$RUN_URL")
          jq -n --arg channel "$CHANNEL" --arg text "$text" \
            '{channel: $channel, markdown_text: $text}' > payload.json
          response=$(curl -sS --fail-with-body -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data @payload.json)
          if [ "$(jq -r '.ok' <<< "$response")" != true ]; then
            echo "::error::Slack chat.postMessage failed: $(jq -r '.error // "no error field"' <<< "$response")"
            exit 1
          fi
